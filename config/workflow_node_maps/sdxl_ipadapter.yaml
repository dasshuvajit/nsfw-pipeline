# Rename map for sdxl/ipadapter.json — input to scripts/rename_workflow_nodes.py
#
# Same usage as sdxl_base.yaml — replace left-hand sides with the numeric
# IDs ComfyUI assigns on a fresh API export, then run the rename tool:
#
#     python scripts/rename_workflow_nodes.py \
#         --input raw_export.json \
#         --map config/workflow_node_maps/sdxl_ipadapter.yaml \
#         --output config/comfyui_workflows/sdxl/ipadapter.json
#
# The IPAdapter template is a superset of base.json with three extra
# required nodes for the reference-image path (checked by
# WorkflowBuilder._REQUIRED_NODES_IPADAPTER). See
# docs/COMFYUI_WORKFLOWS.md for the full node graph + connection order.
#
# ── Shared with base.json ───────────────────────────────────────────
"load_checkpoint": load_checkpoint
"empty_latent": empty_latent
"positive_prompt": positive_prompt
"negative_prompt": negative_prompt
"ksampler": ksampler
"lora_loader_0": lora_loader_0               # optional, only if style profile has LoRAs
"lora_loader_1": lora_loader_1               # optional, 2nd LoRA (max 2 per render)
"vae_decode": vae_decode
"save_image": save_image
# ── IPAdapter-specific (the three extra required nodes) ────────────
"load_reference_image": load_reference_image  # LoadImage (character reference)
"ipadapter_unified_loader": ipadapter_unified_loader  # IPAdapterUnifiedLoader (PLUS preset)
"ipadapter_apply": ipadapter_apply           # IPAdapterAdvanced (weight injected per render)
