# Rename map for sdxl/base.json — input to scripts/rename_workflow_nodes.py
#
# This file documents the semantic node IDs the SDXL base workflow must
# expose. WHEN you next export a fresh API-format JSON from ComfyUI's UI,
# replace the left-hand side of each entry with the numeric IDs that
# ComfyUI assigns (they're arbitrary and change whenever nodes are
# re-added), then run:
#
#     python scripts/rename_workflow_nodes.py \
#         --input raw_export.json \
#         --map config/workflow_node_maps/sdxl_base.yaml \
#         --output config/comfyui_workflows/sdxl/base.json
#
# Until then the file serves as documentation: the RIGHT-hand side is
# the canonical list of semantic IDs that src/render/workflow_builder.py
# injects parameters into. Every one of these must exist in the output
# template or WorkflowBuilder raises WorkflowTemplateError at render
# time. See docs/COMFYUI_WORKFLOWS.md for the full node graph.
#
# ── Required by WorkflowBuilder._REQUIRED_NODES_BASE ────────────────
"load_checkpoint": load_checkpoint           # CheckpointLoaderSimple
"empty_latent": empty_latent                 # EmptyLatentImage
"positive_prompt": positive_prompt           # CLIPTextEncode
"negative_prompt": negative_prompt           # CLIPTextEncode
"ksampler": ksampler                         # KSampler
# ── Optional, only if the style profile has LoRAs (max 2) ───────────
"lora_loader_0": lora_loader_0               # LoraLoader (first LoRA in stack)
"lora_loader_1": lora_loader_1               # LoraLoader (second, if present)
# ── Output chain ────────────────────────────────────────────────────
"vae_decode": vae_decode                     # VAEDecode
"save_image": save_image                     # SaveImage
