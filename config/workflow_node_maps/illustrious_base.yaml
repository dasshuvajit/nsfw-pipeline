# illustrious/base.json is hand-authored with semantic top-level keys
# — no numeric-ID rename step is required. Included for parity with
# sdxl_base.yaml and flux_base.yaml.
#
# Semantic IDs present in config/comfyui_workflows/illustrious/base.json:
#
#   load_checkpoint  CheckpointLoaderSimple  perfectionRealisticILXL_70.safetensors
#   lora_loader_0    LoraLoader              optional slot 0 (stripped if unused)
#   lora_loader_1    LoraLoader              optional slot 1 (stripped if unused)
#   empty_latent     EmptyLatentImage
#   positive_prompt  CLIPTextEncode
#   negative_prompt  CLIPTextEncode
#   ksampler         KSampler                dpmpp_3m_sde + simple @ 24/4
#   vae_decode       VAEDecode
#   save_image       SaveImage
#
# WorkflowBuilder dispatches via family="illustrious" → SDXL code path
# (same graph shape). _strip_unused_lora_loaders handles the 2-LoRA
# Appendix A cap and strips unused lora_loader_N nodes at build time.
# supports_lora=1 and supports_ipadapter=1 in model_registry; activate
# LoRAs by setting style_profiles.lora_stack to a JSON list of
# {"name", "strength"} entries.
#
# illustrious/ipadapter.json extends this with three additional nodes
# (load_reference_image, ipadapter_unified_loader, ipadapter_apply) —
# same IPAdapter chain as sdxl/ipadapter.json.
