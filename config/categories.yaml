# Categories — pure static lookup lists used by the planning modes.
#
# ARCHITECTURE.md §5 (content tiers) + §§8/9/10 (theme/style/niche modes).
#
# Previously seeded into four SQLite tables (theme_categories,
# style_categories, niche_clusters, content_level_rules). Moved here
# because:
#   - These rows are immutable once seeded; runtime never writes them.
#   - YAML makes it much easier to diff and version-control the
#     taxonomy.
#   - One file instead of four seed arrays drops ~150 lines from
#     init_db.py.
#
# Weights are used by weighted-random selection in the mode planners.
# Active rows only (no need for an `active` flag — deleted entries
# just disappear from the list).
#
# ── 2026-04 Phase A overhaul ─────────────────────────────────────────
# Themes + niches rewritten against DeviantArt Premium Gallery
# top-sellers (22-source market research). Generic "studio /
# outdoor / fantasy" buckets retired — they don't map to what buyers
# actually search for. `aesthetic_affinity:` on every theme / style /
# niche points into `config/style_profiles.yaml` archetype ids so
# the planner can prefer compatible archetypes.
# Content-level rules rekeyed to the 4-tier scheme (T1_suggestive,
# T2_implied, T3_artnude, T4_explicit).

# ── Theme categories (Mode 2 — ThemeMode) ────────────────────────────
themes:
