# ── Style categories (Mode 3 — StyleMode) ────────────────────────────
# lighting_bias + color_bias are consumed by StyleMode's LLM plan
# template at style_mode.py:51,52,156,157 — do not remove.
styles:
  # Verifier round-3 IMPORTANT-2 — compatible_environments populated
  # on every style row so StyleMode's env-menu narrowing has data.
  # Each list reflects the style's aesthetic — cinematic lands in
  # rain/neon/urban locations, soft_aesthetic in golden-hour outdoor,
  # fine_art in studio/atelier, etc.
  - id: cinematic
    name: Cinematic
    weight: 1.0
    description: Dramatic lighting, shallow DOF, film-like grading
    lighting_bias: dramatic key + fill
    color_bias: film-grade tones
    aesthetic_affinity: [cinematic_wet_set, neo_noir_neon, boudoir_noir]
