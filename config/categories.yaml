      environment: any
    llm_directive: |
      CONTENT TIER: T3_artnude (DA Premium / Fanvue paywalled).
      FINE-ART NUDE — depict the subject NUDE with anatomically
      correct natural body. This is gallery-print figure work, not
      explicit. Tasteful but unambiguous nudity: visible breasts /
      thighs / glutes are part of the artistic framing. Subject is
