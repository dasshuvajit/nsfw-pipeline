      REQUIRED: pick exactly one `nsfw_anatomy` tag from the vocabulary
      menu. Pick a `nsfw_posture` tag when the pose is reclining or
      kneeling. Do NOT pick `nsfw_act` tags (T4-only). Mood is
      contemplative, intimate, reverent.
      SOLO SUBJECT INVARIANT: every scene is a single-female figure
      study. NEVER describe partners, secondary characters, or groups.
      Booru output starts with `1girl, solo`; prose output says "a
      single adult woman alone" or equivalent. Pronouns singular.
    # Phase D — boost_keywords reduced to []. Tier directive above
    # drives the LLM; appending soft adjectives at sanitizer time was
    # decorative and did not actually push toward anatomy.
    prompt_boost_keywords: []
    prompt_suppress_keywords:
      - explicit
      - graphic
      - spread
      - cartoonish
    platform_allowlist: [deviantart_premium, fanvue]
    description: >-
      Full artistic nude, fine-art framing. DA Premium Gallery / Fanvue
