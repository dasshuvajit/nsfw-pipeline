  T4_explicit:
    allowed_pose_types:
      - standing confident
      - reclining expressive
      - arched back
      - kneeling
      - dynamic pose
      - lounging
      - intimate pose
      - bold pose
    scene_constraints:
      framing: "explicit; NEVER surfaced outside paywall"
      mood_range: [intense, passionate, bold, provocative, raw]
      environment: any
    llm_directive: |
      CONTENT TIER: T4_explicit (Fanvue-paywalled ONLY).
      ARTISTIC NUDE PHOTOGRAPHY — the product is sellable explicit
      adult fine-art for a paywalled platform.

      DEFAULT STATE: the subject (always an adult woman, 18+, mature
      features) is FULLY NUDE — front-facing, with breasts and
      nipples visible, vulva / labia visible, full body bare. This
      is the dominant case, not the exception. Clothing or drapery
      appears ONLY when the scene's locked core fields explicitly
      call for it (e.g. lingerie scene, partial draping for a
      classical pose) — and even then, partial nudity is preferred
      over full coverage. Topless, bottomless, and partial-nude
      framings are valid intermediate states; full-nude is the
      default to aim for.

      ANATOMY MUST BE VISIBLE AND DESCRIBED: scene_prose names the
      anatomy that's visible — bare breasts with natural nipples,
      visible vulva / mons / labia, bare hips and thighs and glutes.
      Use the vocabulary library's family-shaped phrasing — the
      composer translates concept tags into the right wording for
      each model family.

      DO NOT euphemise. Do NOT default to "draped" / "veiled" /
      "shadow hides her form" / "implied nude" — those belong to T2.
      At T4 the body is the composition. Tasteful framing means
      compositional craft (lighting, pose, mood), NOT covering up.

      REQUIRED: pick exactly one `nsfw_anatomy` tag AND exactly one
      `nsfw_act` tag from the vocabulary menu. Strongly prefer
      anatomy tags that maximise visible nudity (`NSFW_FULL_FRONTAL`,
      `NSFW_FULL_NUDE`, `NSFW_VULVA_VISIBLE`, `NSFW_NIPPLES_VISIBLE`)
      over partial ones (`NSFW_BARE_CHEST`, `NSFW_HIPS_THIGHS`)
      unless the scene's pose makes a partial framing more natural.
      For `nsfw_act` at T4, ANY of the eight SOLO tags is valid —
      pick the one that fits the scene's narrative_moment + pose:
      `NSFW_T4_SOLO_TOUCH`, `NSFW_T4_SOLO_DISPLAY`,
      `NSFW_T4_SOLO_RECLINING`, `NSFW_T4_SOLO_MIRROR`,
      `NSFW_T4_SOLO_BATH`, `NSFW_T4_SOLO_GAZE`,
      `NSFW_T4_SOLO_OUTDOOR`, `NSFW_T4_SOLO_PERFORMER`. VARY across
      scenes — repeating the same SOLO_* across every scene defeats
      the diversity push. Partnered act tags (`NSFW_T4_EMBRACE_NUDE`,
      `NSFW_T4_KISS_PASSIONATE`, `NSFW_T4_PARTNERED_INTIMATE`,
      `NSFW_T4_AFTERGLOW`) are FORBIDDEN by the solo-subject
      invariant and will be dropped with an ERROR log. Optionally
      pick a `nsfw_posture` tag when the pose calls for it.

      Mood is intense, passionate, bold, raw, sensual, intimate.

      SOLO SUBJECT INVARIANT: every T4 scene is a solo composition.
      NEVER write "her partner", "with him", "two adults", "they
      embrace", "another person". Scene prose describes ONE adult
      woman; booru output starts with `1girl, solo`. Pronouns singular
      throughout.
    # Phase D — boost_keywords reduced to []. The tier directive above
    # is the LLM-side push; appending "bold, intense, sensual" at
    # sanitizer time was decorative and didn't actually drive nudity.
    prompt_boost_keywords: []
    prompt_suppress_keywords:
      - childlike
      - innocent
      - cute
    platform_allowlist: [fanvue]
    description: >-
      Explicit / graphic. Fanvue-gated ONLY — must never surface on
      DA public or Premium Gallery.
