# ── Content-tier rules (ARCHITECTURE.md §5) ──────────────────────────
# Key = content_level string. The render path looks these up by the
# tier name; callers never iterate over the whole dict.
#
# Platform allow-list (DA policy matrix April 2026):
#   T1 → [deviantart_public, fanvue, patreon_stylized]
#   T2 → [deviantart_public, deviantart_premium, fanvue]
#   T3 → [deviantart_premium, fanvue]
#   T4 → [fanvue]
content_levels:
  T1_suggestive:
    allowed_pose_types:
      - standing relaxed
      - sitting elegantly
      - leaning gently
      - looking over shoulder
      - walking gracefully
      - hand on hip
      - arms crossed
      - hair flip
      - profile pose
    scene_constraints:
      framing: "editorial fashion framing; NO nudity, NO sheer see-through"
      mood_range: [glamorous, confident, playful, elegant, cinematic]
      environment: "any — indoor, outdoor, studio"
    # llm_directive (Phase A) — surfaces tier-specific creative
    # guidance to the SceneFacetGenerator system prompt. Where
    # boost_keywords is a post-composition append, llm_directive shapes
    # what the LLM actually produces. Read by ContentLevelLoader and
    # injected verbatim into the facet generator's system prompt.
    llm_directive: |
      CONTENT TIER: T1_suggestive (DA-public-gallery safe).
      TASTEFUL EDITORIAL — NO nudity, NO sheer or see-through fabric.
      Subject is fully clothed in lingerie / swimwear / fashion editorial.
      Scene mood is glamorous, confident, cinematic. Do NOT pick any
      `nsfw_*` enum tag from the vocabulary menu — those are gated to
      T3+ and the canonicalizer will drop them.
      SOLO SUBJECT: scene depicts exactly one adult woman as the sole
      subject. Do not describe partners, other people, or groups.
    prompt_boost_keywords:
      - lingerie
      - swimwear
      - fashion editorial
      - confident
      - glamorous
      - cinematic
      - editorial beauty
    prompt_suppress_keywords:
      - nude
      - topless
      - nipples
      - explicit
      - raw
    platform_allowlist: [deviantart_public, fanvue, patreon_stylized]
    description: >-
      Suggestive: lingerie, swimwear, revealing outfit — NO nudity.
      Safest tier for DA public gallery + Patreon (stylized only).

  T2_implied:
    allowed_pose_types:
      - standing relaxed
      - sitting elegantly
      - leaning gently
      - looking over shoulder
      - walking gracefully
      - reclining softly
      - hand on hip
      - arms crossed
      - chin on hand
      - profile pose
    scene_constraints:
      framing: "implied nude — drapery / silhouette / pose hides nipples + genitalia"
      mood_range: [elegant, soft, aesthetic, dreamy, serene]
      environment: "neutral or artistic"
    llm_directive: |
      CONTENT TIER: T2_implied (DA public + DA Premium acceptable).
      IMPLIED NUDE — drapery, silhouette, or pose hides nipples and
      genitalia. The subject reads as nude but no anatomy is visible.
      Mood is elegant, soft, aesthetic, dreamy. Do NOT pick any
      `nsfw_*` enum tag — those are gated to T3+. Scene_prose may
      reference the suggestion of nudity (e.g. "draped in silk
      revealing one shoulder") but never describe explicit anatomy.
      SOLO SUBJECT: scene depicts exactly one adult woman as the sole
      subject. Do not describe partners, other people, or groups.
    prompt_boost_keywords:
      - implied nude
      - artistic
      - fine art
      - sculptural
      - drapery
      - graceful
      - tasteful
      - beauty
    prompt_suppress_keywords:
      - explicit
      - raw
      - aggressive
      - spread
      - nipples
      - genitalia
    platform_allowlist: [deviantart_public, deviantart_premium, fanvue]
    description: >-
      Implied nude — no visible nipples or genitalia. DA public gallery
      (with fine-art framing) and DA Premium Gallery both acceptable.

  T3_artnude:
    allowed_pose_types:
      - standing confident
      - reclining expressive
      - classical contrapposto
      - kneeling graceful
      - seated figurative
      - arched back
      - stretching
