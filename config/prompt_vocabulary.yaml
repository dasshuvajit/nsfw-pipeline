  # ── Photographer references — 15 ───────────────────────────────────
  # PetaPixel's 2025 Midjourney study confirms photographer names are
  # the single most-prompted reference category and measurably shift
  # output. Mid-century-and-earlier masters skew toward strong signal;
  # living contemporary photographers skew toward placebo — the 15
  # below are all known-strong-signal references with 5000+ prompts
  # of evidence on Midjourney's public dataset.
  #
  # Pony OMITS this namespace — booru tags don't carry photographer
  # references usefully (no tag like ``helmut_newton_style`` in the
  # danbooru taxonomy). The canonicalizer drops Pony lookups silently.
