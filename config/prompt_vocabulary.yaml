# ── Narrative vocabulary (vocab v6, Phase 2) ──────────────────────────
# The single highest-leverage vocabulary axis per the creative-uplift
# market research. "She reads a letter at dawn" forces window light,
# chair, envelope, fountain pen, stillness — 5 axes solved by 1 tag.
# Editorial photography convention (Hegre, Crewdson, Newton) is built
# on narrative moments rather than held poses. The tag is tier-agnostic
# — "stepping from bath" works at T2_implied (towel-draped) or
# T4_explicit (nude); tier-appropriate anatomy comes from nsfw_* tags.
#
# All families participate. Booru families (Pony/Illustrious) get
# tag-shaped lists; prose families (Flux/Chroma/Flux2) get full
# sentences; SDXL gets comma-noun-phrase.
narrative:
  moment:
    NARR_READING_LETTER_AT_DAWN:
