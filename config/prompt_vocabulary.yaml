# Prompt vocabulary library — abstract concept → per-family phrasing.
#
# The LLM (SceneFacetGenerator) emits abstract enum tags from this
# library (e.g. ``LIGHT_REMBRANDT``, ``CAMERA_85MM_F14``); the
# canonicalizer in src/prompt/vocabulary.py translates them to
# family-specific phrasing at PromptBuilder compose time.
#
# Schema:
#   realism.<namespace>.<CONCEPT_TAG>:                     # always-on
#     <family>: "<family-shaped phrase>"
#   nsfw.<namespace>.<CONCEPT_TAG>:                        # tier-gated
#     tier_min: T<n>_<tier>
#     phrasing:
#       <family>: "<family-shaped phrase>"
#
# Tier values must match content_levels.py:
#   T1_suggestive / T2_implied / T3_artnude / T4_explicit
#
# Family keys must match config/families.yaml:
#   sdxl / pony / illustrious / flux / chroma / flux2
#
# Adding a new concept:
#   1. Add the concept tag under realism.<namespace> (or nsfw.<namespace>).
#   2. Provide phrasing for every applicable family. Pony omits camera /
#      lens / film_stock / art_style (booru tagging vocabulary doesn't
#      carry these as-is — they're implicit in source_photograph + scene_prose).
#   3. Bump ``version:`` at the top.
#   4. Re-run regression suite — fixtures pin the byte-stable output.

