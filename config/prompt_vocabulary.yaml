# ── Environment vocabulary (vocab v6) ─────────────────────────────────
# Phase 1 of the creative-uplift plan. Until v5 every scene shared one
# series-locked environment ("Sun-drenched bedroom"...) — all 24 scenes
# in a series ran in the same room. The environment namespace gives the
# LLM a per-scene location pick from 40 concrete archetypes (decay /
# period luxury / industrial / domestic / outdoor / urban-cinematic /
# theatrical / aquatic) plus 25 atmospheric elements (particulate /
# weather / light / wind / optical) that the canonicalizer threads into
# the prompt body. Categories whitelist compatible_environments per
# theme so the LLM picks from a coherent pool, not the full 40.
#
# Pony phrasings use the booru convention (underscored / lowercase /
# tag-shaped). SDXL uses comma-noun-phrase. Flux/Chroma/Flux2 use
# natural-language prose tuned to each family's T5/CLIP encoder.
# Illustrious sits between Pony (tags) and SDXL (short prose).
