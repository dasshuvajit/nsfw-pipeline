# ── Composition principles vocabulary (vocab v6, Phase 4) ─────────────
# Per-scene compositional rule pick — single tag, optional. Beyond
# the realism.angle / realism.framing namespaces (which cover camera
# position + shot size), this namespace addresses higher-order
# compositional principles like leading lines, framing-in-frame,
# reflection-as-subject. Pony OMITS — booru tags carry composition
# implicitly via positional tags (from_above / from_behind / etc.).
composition:
  principle:
    # COMP_FRAME_WITHIN_FRAME removed (vocab v7, 2026-05-20): "frame-
    # within-frame" reads as a literal nested-frame instruction to
    # SDXL/Chroma and triggers 2x2 image-grid hallucinations. The
    # ``through a doorway`` framing intent is preserved by
    # COMP_FRAME_THROUGH_CURTAIN below, which uses curtain edges (a
    # single soft frame, not a hard rectangular frame).
    COMP_FRAME_THROUGH_CURTAIN:
      sdxl:        "viewed through a parted velvet curtain"
      illustrious: "viewed_through_parted_curtain, velvet_curtain_frame"
      flux:        "Composed as if viewed through a parted velvet curtain, the curtain edges framing the subject"
      chroma:      "viewed through a parted velvet curtain, curtain edges framing the subject"
      flux2:       "Composed as if viewed through a parted velvet curtain, the curtain edges framing the subject and giving the composition a theatrical quality"
    # COMP_REFLECTION_PRIMARY + COMP_REFLECTION_SECONDARY removed
    # (vocab v7, 2026-05-20): both vocab entries are LITERAL duplication
    # instructions — "subject only as a reflection ... real subject out
    # of frame" forces the model to render two figures, and "subject
    # doubled by reflection ... doubled presence" is the textbook
    # 2girls/multiple_subjects trigger. User opted out of reflection
    # compositions entirely.
    COMP_LEADING_LINES_FLOOR:
      sdxl:        "floorboard lines leading from foreground to subject"
      illustrious: "leading_lines_floorboards, foreground_to_subject"
      flux:        "Composed with floorboard lines leading from foreground to subject, the parallel grain pulling the eye inward"
      chroma:      "composition with floorboard lines leading from foreground to subject, parallel grain pulling the eye inward"
      flux2:       "Composed with floorboard lines leading from foreground to subject, the parallel grain pulling the eye inward and emphasising depth"
    COMP_LEADING_LINES_BANISTER:
      sdxl:        "banister curving up toward subject at top of stairs"
      illustrious: "leading_lines_banister, stairway_to_subject"
      flux:        "Composed with a banister curving up toward the subject at the top of the stairs"
      chroma:      "banister curving up toward the subject at the top of the stairs"
      flux2:       "Composed with a banister curving up toward the subject at the top of the stairs, the line drawing the eye unmistakably upward"
    COMP_NEGATIVE_SPACE_DOMINANT:
      sdxl:        "subject pushed into lower-right third, large empty wall above"
      illustrious: "negative_space_dominant, subject_lower_right, empty_upper_two_thirds"
      flux:        "Composed with the subject pushed into the lower-right third of the frame, large empty wall dominating the upper two-thirds"
      chroma:      "subject pushed into the lower-right third, large empty wall dominating the upper two-thirds"
      flux2:       "Composed with the subject pushed into the lower-right third of the frame, large empty wall dominating the upper two-thirds, the negative space carrying as much weight as the subject"
    COMP_FOREGROUND_MIDGROUND_BACKGROUND:
      sdxl:        "out-of-focus foreground object, subject in midground, blurred environment behind"
      illustrious: "foreground_mid_background_layered, out_of_focus_foreground"
      flux:        "Composed in deliberate three-layer depth — an out-of-focus foreground object (a vase, a curtain edge), the subject in midground, blurred environment behind"
      chroma:      "deliberate three-layer composition, out-of-focus foreground object, subject in midground, blurred environment behind"
      flux2:       "Composed in deliberate three-layer depth — an out-of-focus foreground object (a vase, a curtain edge), the subject sharp in midground, blurred environment behind, every plane reading distinctly"
    COMP_SYMMETRY_CENTERED:
      sdxl:        "perfectly centered symmetry, balanced architecture on both sides"
      illustrious: "symmetrical_centered_composition, balanced_architecture"
      flux:        "Composed in perfectly centered Wes-Anderson symmetry, balanced architecture on both sides of the subject"
      chroma:      "perfectly centered Wes-Anderson symmetry, balanced architecture on both sides of the subject"
      flux2:       "Composed in perfectly centered Wes-Anderson symmetry, balanced architecture on both sides of the subject, every line parallel to the frame edge"
    COMP_DUTCH_ANGLE:
      sdxl:        "slight Dutch tilt, off-balance composition"
