      flux2:       "Composed with a slight Dutch tilt, the horizon line off-axis giving the frame an off-balance kinetic feel, the eye tipped just enough to feel the composition's intent"
    COMP_LOW_HERO_SHOT:
      sdxl:        "low-hero shot from below, ceiling visible, subject monumental"
