# ── Aesthetic vocabulary (vocab v6, Phase 3) ──────────────────────────
# Series-level inherited aesthetic anchors. Per editorial-photography
# convention: pin (palette + photographer_ref + art_movement) ONCE on
# the series, hold them constant across every scene. Vary location /
# props / narrative at scene level. This is how Petter Hegre's Tuscany
# Nudes works — one estate, one visual language, every photograph has
# its own moment. The "signature look" — the commercial differentiator
# every top Patreon boudoir creator has — comes from this consistency.
#
# Pony omits aesthetic.photographer_ref and aesthetic.art_movement —
# those names don't carry as booru tags. Pony participates in
# color_palette because palette concepts DO have booru-tag forms.
