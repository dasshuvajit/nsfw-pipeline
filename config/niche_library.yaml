      - "boudoir vanity — warm practical lamplight at an Art-Deco dressing table (no mirror — perfume bottles, powder compact, lamp), silk robe slipping, dressing-room intimacy"
      - "noir-tinged glamour — a single hard key and deep studio shadow tail, smoke and satin, dramatic but elegant, half-light on the face"
    aesthetics:
      palettes: ["silver-grey monochrome", "champagne-and-ivory with soft sepia", "deep oxblood and gold"]
      lighting: ["butterfly/paramount glamour key + fill", "single hard key with a long shadow tail", "warm low practical lamplight"]
      photographers: ["George Hurrell Hollywood glamour", "Clarence Sinclair Bull studio portrait", "early Helmut Newton elegance"]
    brief_seed: "Old-Hollywood glamour — one woman in vintage studio elegance, satin and marcel waves, the lighting and styling of a 1940s star portrait."
    avoid_motifs:
      - "mirrors or vanity mirrors — use a vanity/dressing table dressed with perfume bottles, a powder compact, jewellery and a lamp, never a mirror"

