# Niche library — the "what to make" intelligence for the LLM-direct pipeline.
#
# Drives scripts/art_director.py (via scripts/art_series.py --auto). Each
# niche is a SELF-CONTAINED creative brief: the LLM-direct path does NOT
# touch the deprecated vocab canonicalizer — everything the prompt engine
# needs is readable prose here.
#
# Sourced from the 2026-05-31 market research (workflow w9m6qmriy): the
# proven, lowest-compliance-risk lanes for sellable artistic-nude/boudoir/
# glamour content on DeviantArt. CORE = evergreen, weighted, picked most
# runs; TREND = rotating pool, injected periodically for freshness.
#
# Per niche:
#   id            — stable key (also the --niche selector value)
#   class         — core | trend
#   weight        — relative selection weight within its class
#   tier_band     — tiers this niche supports (run --tier must be one)
#   da_folder     — DeviantArt gallery folder name (subfolder of its family)
#   family        — one of the 5 top-level DA families (atelier / gilded_glamour /
#                   golden_hour / myth_crown / nocturne) — see docs/DA_GO_TO_MARKET.md §3
#   source        — config/categories.yaml id this lane corresponds to (breadcrumb only)
#   tags          — 5-axis DA tag seed (genre / era / subject / mood / discovery); 12-15
#   sub_looks     — 2-4 niche-tuned "label — description" target looks (replace the
#                   global 3 for this niche; the prompt engine rotates them)
#   aesthetics    — palettes / lighting / photographers (plain prose); the selector
#                   locks ONE of each per series ("aesthetic-lock") for a signature look
#   brief_seed    — one-line creative seed handed to the LLM
#
# Compliance note (research-verified): public DeviantArt posts + ALL
# covers/thumbnails must be SFW (T1/T2). Explicit (T3/T4) goes to gated
# Subscriptions / Premium Galleries only. Lean fine-art / fantasy / editorial
# FRAMING (not "hyperrealistic/real woman") to dodge DA's hyperrealism clause.

version: 1

niches:
  # ───────────────────────── EVERGREEN CORE ─────────────────────────
  - id: fine_art_figure_study
    class: core
    weight: 1.2
    # T2 dropped 2026-06-12: the niche's scene DNA IS nudity — at T2 4/6
    # frames rendered fully nude despite implied-only prompts (render drift).
    # Figure study runs T3+ where nudity is the contract, not a violation.
    tier_band: [T3_artnude, T4_explicit]
    da_folder: "Fine-Art Figure Study"
    family: atelier
    source: fine_art_figurative
    tags: [fineartnude, figurestudy, figure, artnude, chiaroscuro, blackandwhite,
           monochrome, classical, form, sculptural, aiart, digitalart, portrait]
    sub_looks:
      - "studio chiaroscuro figure study — single hard key against a black seamless backdrop, the body sculpted by light and deep shadow, gallery figure-study framing, B&W or near-monochrome"
      - "north-light atelier — soft directional daylight from a tall studio window across a plinth or stool, classical sculptural pose, muted neutral tones, fine-art nude tradition"
      - "low-key rim study — a single rim light tracing the edge of the form out of darkness, the silhouette and contour as the subject, restrained and reverent"
      - "raw atelier with plaster casts — soft skylight from above in a working sculptor's studio, plaster dust and unfinished white casts around the living model, the body posed among fragments"
      - "draped-canvas abstraction — the figure half-wrapped in heavy raw canvas against a grey seamless, one hard side light, folds and flesh composed as a single sculptural form"
      - "contact-shadow study — the body close against a textured plaster wall, a hard raking key throwing her crisp shadow beside her as a second graphic form"
      - "cold pre-dawn studio — thin blue first light seeping through a frosted clerestory across a bare wooden plinth, the form held in cool grey half-tone and faint breath-mist, charcoal-and-ivory neutrals, hushed reverent stillness before the working day"
      - "high-noon overhead shaft — one hard vertical beam dropping straight down from a roof oculus onto a plaster pedestal, the body modelled in steep top-down light and a deep black floor-shadow, scorched-white and deep-shade contrast, austere and sculptural"
      - "soft overcast atelier — flat even silver daylight from a wide north skylight filling the room without shadow, the figure standing among draped easels and a muslin backdrop, low-contrast pewter-grey tonality, calm graphic clarity"
      - "golden-hour dust study — warm low side-sun raking through a tall west window, suspended studio dust turned to drifting gold motes around the form, a fall of unbleached linen over a stool, sepia monochrome warmth, quiet reverence"
      - "grid-shadow projection — a single hard lamp thrown through a tall multi-pane window casting a crisp lattice of light and shade across skin and the studio floor, the body and the cast grid composed as interlocking forms, stark high-contrast B&W"
      - "candle-and-ember nocturne — one low guttering taper on a sculptor's bench carving the figure out of near-total dark, warm amber falloff over bare boards and a shrouded armature, deep shadow and a single soft highlight, intimate and grave"
    aesthetics:
      palettes: ["high-contrast black-and-white", "warm sepia monochrome", "muted charcoal-and-ivory neutrals"]
      lighting: ["single hard key, Caravaggio chiaroscuro", "soft north-window daylight", "split lighting, half the face in shadow"]
      photographers: ["Edward Weston figure-study tradition", "Robert Mapplethorpe sculptural B&W", "Ruth Bernhard luminous nude"]
    brief_seed: "A fine-art figure study — one nude woman rendered as sculptural form in light, gallery framing, the body as subject, not spectacle."

