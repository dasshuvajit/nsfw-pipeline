# Niche library — the "what to make" intelligence for the LLM-direct pipeline.
#
# Drives scripts/art_director.py (via scripts/art_series.py --auto). Each
# niche is a SELF-CONTAINED creative brief: the LLM-direct path does NOT
# touch the deprecated vocab canonicalizer — everything the prompt engine
# needs is readable prose here.
#
# Sourced from the 2026-05-31 market research (workflow w9m6qmriy): the
# proven, lowest-compliance-risk lanes for sellable artistic-nude/boudoir/
# glamour content on DeviantArt. CORE = evergreen, weighted, picked most
# runs; TREND = rotating pool, injected periodically for freshness.
#
# Per niche:
#   id            — stable key (also the --niche selector value)
#   class         — core | trend
#   weight        — relative selection weight within its class
#   tier_band     — tiers this niche supports (run --tier must be one)
#   da_folder     — DeviantArt gallery / Premium-Gallery folder name
#   source        — config/categories.yaml id this lane corresponds to (breadcrumb only)
#   tags          — 5-axis DA tag seed (genre / era / subject / mood / discovery); 12-15
#   sub_looks     — 2-4 niche-tuned "label — description" target looks (replace the
#                   global 3 for this niche; the prompt engine rotates them)
#   aesthetics    — palettes / lighting / photographers (plain prose); the selector
#                   locks ONE of each per series ("aesthetic-lock") for a signature look
#   brief_seed    — one-line creative seed handed to the LLM
#
# Compliance note (research-verified): public DeviantArt posts + ALL
# covers/thumbnails must be SFW (T1/T2). Explicit (T3/T4) goes to gated
# Subscriptions / Premium Galleries only. Lean fine-art / fantasy / editorial
# FRAMING (not "hyperrealistic/real woman") to dodge DA's hyperrealism clause.

version: 1

