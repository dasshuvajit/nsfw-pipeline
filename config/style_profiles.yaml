    lighting_hint: butterfly key + fill + tail, high-contrast studio
    suited_tiers: [T1_suggestive, T2_implied, T3_artnude]
    suited_families: [sdxl, illustrious, chroma, flux2]
    # Vintage studio glam pairs with sepia / monochrome / jewel-tone
    # palettes, vintage editorial photographers (Avedon / Lindbergh /
    # Newton early work), and art-deco / film-noir art movements.
    compatible_palettes:
      - PALETTE_SEPIA_PLATINUM
      - PALETTE_MONOCHROME_HIGH_CONTRAST
      - PALETTE_GREAT_GATSBY_JEWEL
      - PALETTE_VOGUE_EDITORIAL
    compatible_photographers:
      - PHOTOG_RICHARD_AVEDON
      - PHOTOG_HELMUT_NEWTON
      - PHOTOG_HERB_RITTS
      - PHOTOG_PETER_LINDBERGH
      - PHOTOG_SARAH_MOON
    compatible_art_movements:
      - ART_MOVE_ART_DECO_1920S
      - ART_MOVE_FILM_NOIR_1940S
      - ART_MOVE_HOPPER
    compatible_environments:
      - ENV_OLD_HOLLYWOOD_BOUDOIR
      - ENV_ART_DECO_HOTEL_SUITE
      - ENV_VICTORIAN_PARLOUR
      - ENV_BACKSTAGE_DRESSING_ROOM
