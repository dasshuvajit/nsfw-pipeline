# Style profiles — aesthetic intent (2026-04 Phase A overhaul).
#
# A profile describes WHAT the image should look / feel like (palette,
# lighting, lens character, mood). It no longer describes HOW to render
# it (sampler / scheduler / steps / cfg / LoRA stack) — those live with
# the model in ``config/models/*.yaml`` and are resolved by
# ``StyleProfileForWorkflow`` from ``model.default_sampler`` etc.
#
# Why the split:
#   - Buyers on DeviantArt search for an aesthetic archetype
#     ("Boudoir Noir", "Old Hollywood Glamour") — not render-tuning.
#   - Fusing tuning with aesthetic locked one checkpoint per profile,
#     which blocked mixing (e.g. applying the Boudoir Noir look on
#     Chroma vs. Juggernaut).
#   - Render tuning is measured per checkpoint; it belongs next to
#     the checkpoint, not the aesthetic.
#
# After 2026-05-20: the characters table was removed; style profiles
# are referenced only via ``series.style_profile_id`` and the
# ``--style-profile`` CLI override. The model comes from
# ``images.model_id`` (or ``--models`` CLI override).
#
# Archetypes are the top-10 DA NSFW realism segments surfaced in the
# 2026-04 market research. If you add one, also update the theme /
# niche / style ``aesthetic_affinity`` lists in
# ``config/categories.yaml`` so planners can prefer compatible archetypes.

profiles:
  boudoir_noir:
    name: Boudoir Noir
    description: >-
      Dark intimate bedroom, low-key chiaroscuro, warm shadow. Shadows
      do most of the compositional work — hard single-source light,
      deep blacks, warm skin against cool wall tones.
    base_style_keywords: >-
      low-key lighting, chiaroscuro, warm shadow, deep blacks, 85mm,
      f/1.4, film grain, editorial grade, intimate mood
    base_negative_prompt: >-
      flat lighting, harsh overhead light, bright outdoor, cheap
      studio, washed out, overexposed, fluorescent
    palette_hint: deep crimson, amber, charcoal, warm shadow
    lighting_hint: single-source hard-shadow, window slat, bedside lamp
    suited_tiers: [T2_implied, T3_artnude, T4_explicit]
    suited_families: [sdxl, chroma, flux, flux2]
    # Phase 3 (vocab v6) — aesthetic-anchor compatibility lists.
    # Narrow the SeriesPlanner LLM menu to coherent combinations.
    # Boudoir noir = low-key, chiaroscuro, intimate — pairs with
    # Newton/Mapplethorpe/Henson photographers, dark cinematic
    # palettes, baroque/film-noir art movements.
    compatible_palettes:
      - PALETTE_BAROQUE_CARAVAGGIO
      - PALETTE_MONOCHROME_LOW_KEY
      - PALETTE_MONOCHROME_HIGH_CONTRAST
      - PALETTE_DEAKINS_AMBER_TUNGSTEN
      - PALETTE_SEPIA_PLATINUM
      - PALETTE_VOGUE_EDITORIAL
    compatible_photographers:
      - PHOTOG_HELMUT_NEWTON
      - PHOTOG_BILL_HENSON
      - PHOTOG_ROBERT_MAPPLETHORPE
      - PHOTOG_PAOLO_ROVERSI
      - PHOTOG_PETER_LINDBERGH
    compatible_art_movements:
      - ART_MOVE_BAROQUE_CARAVAGGIO
      - ART_MOVE_FILM_NOIR_1940S
      - ART_MOVE_REMBRANDT_PORTRAIT
      - ART_MOVE_HOPPER
    # Verifier round-3 IMPORTANT-2 — environments coherent with the
    # low-key chiaroscuro / intimate boudoir aesthetic.
    compatible_environments:
      - ENV_MORNING_BEDROOM
      - ENV_OLD_HOLLYWOOD_BOUDOIR
      - ENV_VICTORIAN_PARLOUR
      - ENV_GEORGIAN_LIBRARY
      - ENV_PARIS_ATTIC_APARTMENT
      - ENV_HOTEL_LOBBY_NOIR
      - ENV_LOG_CABIN_FIRELIT
      - ENV_VANITY_DRESSING_ROOM
    # 2026-05-23 — per-scene art_style menu narrowing. Boudoir noir
    # pairs with intimate / editorial / classic-glam art styles;
    # excludes Herb Ritts (outdoor sun-shadow), Irving Penn (high-key
    # minimalism), classical Renaissance figure-study.
    compatible_art_styles:
      - ART_BOUDOIR_NOIR
      - ART_FINE_NUDE
      - ART_NUDE_PHOTOGRAPHY
      - ART_OLD_HOLLYWOOD
      - ART_HELMUT_NEWTON

  old_hollywood_glamour:
