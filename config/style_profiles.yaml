    # editorial + Newton's vintage fashion work. Excludes classical
    # Renaissance, Ritts outdoor, Penn minimalism, modern editorial.
    compatible_art_styles:
      - ART_OLD_HOLLYWOOD
      - ART_BOUDOIR_NOIR
      - ART_HELMUT_NEWTON
      - ART_EDITORIAL_FASHION
      - ART_FINE_NUDE

