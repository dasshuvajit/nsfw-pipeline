  # ---------------------------------------------------------------------------
  # To add another LLM: ollama pull <tag>, then add an entry below mirroring
  # the shape above. Set active: true to make it routable. Setting it as
  # default_llm makes it the project-wide default.
  #
  # To add a REMOTE API model (OpenRouter / OpenAI / DeepSeek / GLM-Zhipu / any
  # OpenAI-compatible gateway): set backend + the exact remote id, and configure
  # base_url + the api-key env var in pipeline.yaml::openai_compatible. Remote
  # models are reachable only via --llm <id> / --model-tag, so the local default
  # is untouched. ⚠️ Frontier API models are censored for explicit NSFW — use
  # them for non-explicit concept / composition / SFW covers / metadata only.
  # Copy-paste template (uncomment + set the id, then add the matching
  # pipeline.yaml block + export the key):
  #
  #   openrouter_example:
  #     backend: openai_compatible
  #     openai_compatible_id: "anthropic/claude-opus-4.1"   # exact gateway id
  #     display_name: "OpenRouter — example"
  #     context_tokens: 200000
  #     families_recommended: ["all"]
  #     active: true
  # ---------------------------------------------------------------------------

# Default LLM used when no model tag is given on the CLI. Must be the registry
# id (not the ollama_id) of an active entry above.
#
# 2026-06-11 — W5 dense-vs-MoE A/B (fixed T4 brief, count 8, gate-v2 +
# blind 4-lens panel): deckard_gemma4_31b_heretic (dense 31B, same Gemma
# lineage) BEAT this default on every axis — audit 9.31 vs 8.81, blind
# overall 7.42 vs 6.79, vividness 7.19 vs 6.72, 8/8 delivery, 4 vs 10
# churn events — at ~96s/prompt vs 27s (~3.5x slower LLM phase, still
# under the 2-min/prompt bar). skyfall_31b_heretic_clear was ELIMINATED
# (7.14 audit, 7/8 shortfall, ~3min/prompt, one literal refusal shipped —
# which exposed + fixed the gate's missing refusal detector). User
# confirmed the switch 2026-06-11: DECKARD is the default; Gemma 26B-A4B
# stays registered as the fast iteration option (--model-tag), Cydonia
# stays fallback_llm.
#
# 2026-05-24 — switched from davidau_nemo_thinking_heretic_claude_opus to
# gemma_4_26b_a4b_heretic after a 5-LLM A/B audit (Gemma 1B, DavidAU 12B,
# Cydonia 24B, Gemma 4 26B A4B, Supergemma4 26B v2). Gemma 4 26B MoE-A4B
# placed first by audit_prompts.py rubric (9.84/10 vs DavidAU's 9.46 and
# Supergemma4's 9.76) and produced ZERO hedge-phrase rejections across
# the run, vs DavidAU's ~5 hedge rejects per series. The MoE arch
# (4B active per token across 26B total) gives near-DavidAU wall-clock
# despite the larger total footprint. Trade: 16 GB RAM resident vs
# DavidAU's 7.5 GB — acceptable on the 48 GB Mac M4 Pro target.
# 2026-06-15 (evening) — default set to gemma4_26b_a4b_uncensored_hauhaucs_balanced
# after the overnight 3-way A/B vs the two new downloads (fixed T4 brief, count 8,
# temp 0.85, timed): HauhauCS 26B won — audit 9.12 (only model with ALL 8 prompts
# >=8.5) at 15.3s/prompt, the FASTEST of the three. It beats the prior default
# gemma_4_26b_a4b_heretic (8.94 @ 21.8s) on quality AND speed, and matches the new
# llmfan46 31B (gemma_4_31b_it_uncensored_heretic, 9.12) at ~8x its speed (125.3s).
# All three stay registered (--model-tag); the 31B is the prose-quality fallback.
#
# (Earlier 2026-06-15 — default had been gemma_4_26b_a4b_heretic, itself reversing
#  the 2026-06-11 dense-31B prose-quality win for speed; superseded by this A/B.)
default_llm: gemma4_26b_a4b_uncensored_hauhaucs_balanced

# Fallback LLM — used by ``OllamaClient.generate_json(fallback_model=...)``
# when the primary model fails twice in a row (constrained-decoding +
# Pydantic validation both reject the response). The retry path is opt-in;
# agents pass ``fallback_model=router.fallback().ollama_id`` per call.
# Must be a registry id of an active entry above. Set to a DIFFERENT id from
# default_llm to gain diversity on the retry; set to the same id to collapse
# the fallback dimension (single-LLM operation).
#
# 2026-05-22 — pointed at cydonia_heretic_24b. Cydonia is the
# gold-standard for vocabulary discipline (~0.4 hallucination/scene vs
# DavidAU's 0.79) and a different runtime backend (Ollama vs LM Studio),
# so a primary-side failure has both a quality backstop and an
# infrastructure backstop. Prior choice qwen3_abliterated_30b was a
# different-lineage retry but is itself a 30B MoE — too heavyweight as
# a backup for a 12B primary; Cydonia 24B is the right size class.
fallback_llm: cydonia_heretic_24b
