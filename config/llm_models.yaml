# =============================================================================
# LLM Registry — declared installed Ollama models the pipeline can use
# =============================================================================
# Each entry maps a stable registry id (used by --llm flag, routing config in
# pipeline.yaml, and prompts.llm_id / scene_facets.llm_id in the DB) to the
# Ollama tag installed on this machine.
#
# To add a new LLM:
#   1. ollama pull <ollama_tag>
#   2. add an entry below with a unique registry id
#   3. (optional) set as default by editing default_llm at the bottom
#
# Validation: at startup the loader rejects:
#   - default_llm pointing to a missing or inactive entry
#   - any pipeline.yaml::llm.routing.* target that doesn't resolve here
# Validation tests live in tests/test_llm_registry.py.
# =============================================================================

llms:
  cydonia_heretic_24b:
    ollama_id: "Fermi/Cydonia-24B-v4.3-heretic-vision:Q4_K_M"
    display_name: "Cydonia 24B v4.3 (Heretic Vision)"
    description: "Heretic-tuned (refusal-removed) variant of Cydonia 24B v4.3. Mistral Small 24B base + initiative-taking creative-writing layer; the heretic fine-tune drops the refusal floor for explicit-tier work without sacrificing prose quality. Default LLM for every role — routing intentionally collapsed so this model serves every agent (planner, scene generator, facet generator, metadata, character creator)."
    quant: "Q4_K_M"
    size_gb: 14
    context_tokens: 32768
    refusal_rate: 2.0           # community-reported for heretic-flavour tunes
    strengths:
      - "low refusal floor (heretic tune)"
      - "creative writing"
      - "initiative-taking prose"
      - "RP-tuned booru tag generation"
    families_recommended: ["all"]
    active: true

  magnum_v4_27b:
    ollama_id: "fluffy/magnum-v4-27b:latest"
    display_name: "Magnum v4 27B"
    description: "anthracite-org Magnum v4 27B (fluffy quant) — Gemma 2 27B base fine-tuned on Claude 3 Sonnet/Opus prose for creative writing and intimate-scene narrative. Dense 27B parameters. The Magnum line targets editorial-tier RP/creative prose explicitly — historically the strongest community choice for evocative scene descriptions vs raw uncensored output. Different lineage from Cydonia (Gemma 2 vs Mistral 24B) makes it a meaningful prose-quality A/B target. NOTE: 8K native context (vs Cydonia's 32K) — pipeline prompts must fit. Inference also slower than Cydonia on Apple Silicon (Gemma 2 attention pattern is less Metal-friendly). Registered 2026-05-19 replacing the qwen36_abliterated_27b slot."
    quant: "Q4_K_M"
    size_gb: 17
    context_tokens: 8192
    refusal_rate: 3.0           # Magnum line is "open" but slightly higher than abliterated
    strengths:
      - "Claude-style prose quality (Sonnet/Opus distillation)"
      - "editorial / RP narrative tuning"
      - "Gemma 2 base — different lineage from Cydonia (Mistral)"
      - "dense 27B — full capacity per token"
    families_recommended: ["all"]
    active: true

  qwen3_abliterated_30b:
    ollama_id: "huihui_ai/qwen3-abliterated:30b-a3b"
    display_name: "Qwen3 30B-A3B (Abliterated)"
    description: "huihui_ai abliterated (refusal-removed) variant of Qwen3 30B-A3B. Mixture-of-experts architecture: ~30B total parameters, ~3B active per token, ~18GB on disk at Q4. Compute behaves like a 3B model while capacity behaves like a 30B — fast inference with high capacity. The abliteration drops refusal floor for explicit-tier work. Different lineage from Cydonia (Qwen vs Mistral) makes it a meaningful A/B target. Registered 2026-05-19 as the second of two installed LLMs (replacing the Hermes 3 8B variants — they failed to populate structured enum-tag fields under constrained decoding)."
    quant: "Q4"
    size_gb: 18
    context_tokens: 32768
    refusal_rate: 2.0           # community-reported for abliterated variants
    strengths:
      - "low refusal floor (abliterated)"
      - "MoE — fast (3B active params per token)"
      - "high-capacity (30B total) at inference cost of a 3B model"
      - "different lineage from Cydonia (Qwen vs Mistral) — A/B target"
    families_recommended: ["all"]
    active: true

  # ---------------------------------------------------------------------------
  # To add another LLM: ollama pull <tag>, then add an entry below mirroring
  # the shape above. Set active: true to make it routable. Setting it as
  # default_llm makes it the project-wide default.
  # ---------------------------------------------------------------------------

# Default LLM used when --llm flag is omitted on the CLI and no per-role
# routing entry in pipeline.yaml::llm.routing applies. Must be the registry
# id (not the ollama_id) of an active entry above.
default_llm: cydonia_heretic_24b

# Fallback LLM — used by ``OllamaClient.generate_json(fallback_model=...)``
# when the primary model fails twice in a row (constrained-decoding +
# Pydantic validation both reject the response). The retry path is opt-in;
# agents pass ``fallback_model=router.fallback().ollama_id`` per call.
# Must be a registry id of an active entry above. Set to a DIFFERENT id from
# default_llm to gain diversity on the retry; set to the same id to collapse
# the fallback dimension (single-LLM operation).
fallback_llm: qwen3_abliterated_30b
