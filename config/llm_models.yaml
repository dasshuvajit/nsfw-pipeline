    size_gb: 19
    context_tokens: 32768
    refusal_rate: 1.0            # heretic
    is_reasoning_model: false    # probe instruct-mode first; flip if JSON breaks
    strengths: ["vivid creative tune", "dense 31B", "same Gemma lineage as default"]
