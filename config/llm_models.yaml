# =============================================================================
# LLM Registry — declared installed Ollama models the pipeline can use
# =============================================================================
# Each entry maps a stable registry id (used by --llm flag, routing config in
# pipeline.yaml, and prompts.llm_id / scene_facets.llm_id in the DB) to the
# Ollama tag installed on this machine.
#
# To add a new LLM:
#   1. ollama pull <ollama_tag>
#   2. add an entry below with a unique registry id
#   3. (optional) set as default by editing default_llm at the bottom
#
# Validation: at startup the loader rejects:
#   - default_llm pointing to a missing or inactive entry
#   - any pipeline.yaml::llm.routing.* target that doesn't resolve here
# Validation tests live in tests/test_llm_registry.py.
# =============================================================================

llms:
  cydonia_24b_v43:
    ollama_id: "moophlo/Cydonia-24B-v4.3-GGUF:Q4_K_M"
    display_name: "Cydonia 24B v4.3"
    description: "Initiative-taking creative-writing model. Best general-purpose pick; RP-tuning handles booru tag generation cleanly."
    quant: "Q4_K_M"
    size_gb: 14
    context_tokens: 32768
    refusal_rate: 5.0           # community-reported, not vendor-tested
    strengths:
      - "creative writing"
      - "initiative-taking prose"
      - "RP-tuned (handles booru tag generation cleanly)"
    families_recommended: ["all"]
    active: true

  venice_24b:
    ollama_id: "ikiru/Dolphin-Mistral-24B-Venice-Edition"
    display_name: "Dolphin Mistral 24B Venice"
    description: "Lowest-refusal floor (~2.2%). Best for explicit-tier metadata generation where vocabulary lookup matters."
    quant: "Q5_K_M"
    size_gb: 17
    context_tokens: 32768
    refusal_rate: 2.2
    strengths:
      - "lowest refusal floor (~2.2%)"
      - "platform metadata (tags, titles, captions)"
    families_recommended: ["all"]
    active: true

  magnum_v4_22b:
    ollama_id: "fluffy/magnum-v4-22b:q6_K"
    display_name: "Magnum v4 22B"
    description: "Claude-Opus-distilled prose. Best for prose-style families (Flux/Chroma/Flux2)."
    quant: "Q6_K"
    size_gb: 17
    context_tokens: 32768
    refusal_rate: 10.0
    strengths:
      - "Claude-style prose"
      - "natural-language scene descriptions"
    families_recommended: ["flux", "chroma", "flux2"]
    active: true

  # ---------------------------------------------------------------------------
  # Recommended-but-not-yet-installed: uncomment after `ollama pull <tag>` to
  # enable. huihui_ai/qwen3-30b-a3b-abliterated is a 30B MoE (~3B active) — the
  # fastest tokens/sec model available on M4 Pro for batch scene generation.
  # Add to routing.scene_generator in pipeline.yaml once installed for ~3x
  # faster 25-scene batches without sacrificing quality.
  # ---------------------------------------------------------------------------
  # qwen3_30b_a3b:
  #   ollama_id: "huihui_ai/qwen3-30b-a3b-abliterated"
  #   display_name: "Qwen3 30B A3B (abliterated)"
  #   description: "MoE — 30B params / 3B active. ~70 tok/s on M4 Pro batch."
  #   quant: "Q4_K_M"
  #   size_gb: 18
  #   context_tokens: 32768
  #   refusal_rate: 0.0
  #   strengths:
  #     - "fastest tokens/sec for batch scene generation"
  #     - "MoE efficiency on Apple unified memory"
  #   families_recommended: ["all"]
  #   active: true

# Default LLM used when --llm flag is omitted on the CLI and no per-role
# routing entry in pipeline.yaml::llm.routing applies. Must be the registry
# id (not the ollama_id) of an active entry above.
default_llm: cydonia_24b_v43
