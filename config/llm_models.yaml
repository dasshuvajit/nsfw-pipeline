      SynthRP, and Synthstruct. Designed to replicate Claude 3
      Sonnet/Opus prose for creative/RP narrative. Gemma license
      (Google's open model license — commercial use allowed with
      Gemma's usage-policy carve-outs). NOT abliterated — refusals
      are reduced via training-data selection, not weight surgery,
      so the floor is higher than Cydonia heretic / qwen3
      abliterated. Lineage diversity vs Cydonia (Gemma 2 vs Mistral)
      makes it a meaningful prose-quality A/B target. Caveats: 8K
      native context (vs 32K elsewhere — long few-shot prompts may
      truncate); slower on Apple Silicon (Gemma 2 attention pattern
      is less Metal-friendly than Mistral / Qwen).
    quant: "Q4_K_M"
    size_gb: 17
    context_tokens: 8192
    refusal_rate: 3.0           # creative-RP-tuned but not abliterated
    strengths:
      - "Claude-style prose quality (Sonnet/Opus distillation)"
      - "editorial / RP narrative tuning"
      - "Gemma 2 base — different lineage from Cydonia (Mistral)"
      - "dense 27B — full capacity per token"
    families_recommended: ["all"]
    active: false  # 2026-06-11 W5 hygiene: 8K context cannot fit the ~5K-token T4 system prompt

