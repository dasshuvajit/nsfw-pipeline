# =============================================================================
# LLM Registry — declared installed Ollama models the pipeline can use
# =============================================================================
# Each entry maps a stable registry id (used by --llm flag, routing config in
# pipeline.yaml, and prompts.llm_id / scene_facets.llm_id in the DB) to the
# Ollama tag installed on this machine.
#
# To add a new LLM:
#   1. ollama pull <ollama_tag>
#   2. add an entry below with a unique registry id
#   3. (optional) set as default by editing default_llm at the bottom
#
# Validation: at startup the loader rejects:
#   - default_llm pointing to a missing or inactive entry
#   - any pipeline.yaml::llm.routing.* target that doesn't resolve here
# Validation tests live in tests/test_llm_registry.py.
# =============================================================================

llms:
  cydonia_heretic_24b:
    ollama_id: "Fermi/Cydonia-24B-v4.3-heretic-vision:Q4_K_M"
    display_name: "Cydonia 24B v4.3 (Heretic Vision)"
    description: "Heretic-tuned (refusal-removed) variant of Cydonia 24B v4.3. Mistral Small 24B base + initiative-taking creative-writing layer; the heretic fine-tune drops the refusal floor for explicit-tier work without sacrificing prose quality. Default LLM for every role — routing intentionally collapsed so this model serves every agent (planner, scene generator, facet generator, metadata, character creator)."
    quant: "Q4_K_M"
    size_gb: 14
    context_tokens: 32768
    refusal_rate: 2.0           # community-reported for heretic-flavour tunes
    strengths:
      - "low refusal floor (heretic tune)"
      - "creative writing"
      - "initiative-taking prose"
      - "RP-tuned booru tag generation"
    families_recommended: ["all"]
    active: true

  hermes3_70b:
    ollama_id: "hermes3:70b-llama3.1-q4_K_M"
    display_name: "Hermes 3 70B (Llama 3.1)"
    description: |
      Nous Research Hermes 3 on Llama 3.1, 70B parameter Q4_K_M GGUF
      (~40 GB on disk). HARDWARE NOTE: empirically validated 2026-05-18
      on M4 Pro 48 GB unified memory — Ollama's model runner crashes
      mid-inference with "resource limitations" error because the 40 GB
      model plus 5-10 GB OS/app overhead exceeds the practical inference
      headroom. Tested with the standalone /api/generate endpoint:
      Ollama returns 500 "model runner has unexpectedly stopped" after
      a 6+ min hang. Larger-RAM systems (64 GB+) or smaller quants
      (Q3_K_M ~30 GB, Q2_K ~24 GB) would likely work.
      To enable on this machine, either close all other apps to free
      ~10 GB of unified memory, or downgrade to a smaller quant via
      ``ollama pull hermes3:70b-llama3.1-q3_K_M``. Keeping the entry
      active so the user can flip-test later; selecting via --llm
      hermes3_70b currently surfaces the Ollama crash inside Phase A.
    quant: "Q4_K_M"
    size_gb: 40
    context_tokens: 32768
    refusal_rate: 8.0           # community-reported; Hermes 3 base is mildly permissive
    strengths:
      - "strong instruction-following (in theory; not validated on this hardware)"
      - "Claude-style prose (Hermes lineage)"
      - "different lineage from Cydonia (Llama 3.1 vs Mistral) — good A/B target on bigger hardware"
      - "70B-class reasoning"
    active: true
    families_recommended: ["all"]

  hermes3:
    ollama_id: "hermes3:latest"
    display_name: "Hermes 3 8B (latest)"
    description: "Nous Research Hermes 3 on Llama 3.1. The :latest Ollama tag defaults to the 8B variant — smaller and faster than the 24B Cydonia primary. Used as the fallback LLM (OllamaClient.generate_json retries with this when the primary fails twice in a row), and available via --llm hermes3 for fast ad-hoc smoke tests."
    quant: "Q4_K_M"
    size_gb: 5
    context_tokens: 32768
    refusal_rate: 10.0          # community-reported; Hermes is moderately permissive
    strengths:
      - "fast (8B; lower memory footprint)"
      - "general-purpose instruct follower"
      - "different lineage from primary (Llama 3.1 vs Mistral)"
    families_recommended: ["all"]
    active: true

  # ---------------------------------------------------------------------------
  # To add another LLM: ollama pull <tag>, then add an entry below mirroring
  # the shape above. Set active: true to make it routable. Setting it as
  # default_llm makes it the project-wide default.
  # ---------------------------------------------------------------------------

# Default LLM used when --llm flag is omitted on the CLI and no per-role
# routing entry in pipeline.yaml::llm.routing applies. Must be the registry
# id (not the ollama_id) of an active entry above.
default_llm: cydonia_heretic_24b

# Fallback LLM — used by ``OllamaClient.generate_json(fallback_model=...)``
# when the primary model fails twice in a row (constrained-decoding +
# Pydantic validation both reject the response). The retry path is opt-in;
# agents pass ``fallback_model=router.fallback().ollama_id`` per call.
# Must be a registry id of an active entry above. Set to a DIFFERENT id from
# default_llm to gain diversity on the retry; set to the same id to collapse
# the fallback dimension (single-LLM operation).
fallback_llm: hermes3
