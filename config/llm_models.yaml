# =============================================================================
# LLM Registry — declared installed Ollama models the pipeline can use
# =============================================================================
# Each entry maps a stable registry id (used by --llm flag, routing config in
# pipeline.yaml, and prompts.llm_id / scene_facets.llm_id in the DB) to the
# Ollama tag installed on this machine.
#
# To add a new LLM:
#   1. ollama pull <ollama_tag>
#   2. add an entry below with a unique registry id
#   3. (optional) set as default by editing default_llm at the bottom
#
# Validation: at startup the loader rejects:
#   - default_llm pointing to a missing or inactive entry
#   - fallback_llm pointing to a missing or inactive entry
#   - any pipeline.yaml::llm.routing.* target that doesn't resolve here
# Validation tests live in tests/test_llm_registry.py.
# =============================================================================

llms:
  cydonia_heretic_24b:
    ollama_id: "Fermi/Cydonia-24B-v4.3-heretic-vision:Q4_K_M"
    display_name: "Cydonia 24B v4.3 (Heretic Vision)"
    description: >-
      TheDrummer/Cydonia-24B-v4.3 → coder3101's heretic (refusal-removed)
      tune → Fermi's vision-grafted variant. Lineage: Mistral Small 3.1
      24B base → 3.2-Instruct → Cydonia v4.3 creative-writing fine-tune
      → heretic abliteration → Pixtral vision projector from Mistral
      Small 3.2 grafted on. Apache 2.0 (inherited from Mistral Small).
      Vision-capable but the pipeline drives it text-only — the vision
      head is dormant for prompt-generation work. Default LLM for every
      agent role; routing intentionally collapsed onto this entry.
    quant: "Q4_K_M"
    size_gb: 14
    context_tokens: 32768
    refusal_rate: 2.0           # heretic abliteration drops refusals
    strengths:
      - "low refusal floor (heretic abliteration)"
      - "creative writing (Cydonia base tune)"
      - "initiative-taking prose"
      - "booru tag generation tested clean"
      - "32K context — fits long few-shot prompts comfortably"
    families_recommended: ["all"]
    active: true

  magnum_v4_27b:
    ollama_id: "fluffy/magnum-v4-27b:latest"
    display_name: "Magnum v4 27B"
    description: >-
      anthracite-org/magnum-v4-27b (fluffy quant). Gemma 2 27B base
      (IntervitensInc's ChatML'ified fork) fine-tuned on 9 curated
      datasets including kalo-opus-instruct-22k-no-refusal,
      SynthRP, and Synthstruct. Designed to replicate Claude 3
      Sonnet/Opus prose for creative/RP narrative. Gemma license
      (Google's open model license — commercial use allowed with
      Gemma's usage-policy carve-outs). NOT abliterated — refusals
      are reduced via training-data selection, not weight surgery,
      so the floor is higher than Cydonia heretic / qwen3
      abliterated. Lineage diversity vs Cydonia (Gemma 2 vs Mistral)
      makes it a meaningful prose-quality A/B target. Caveats: 8K
      native context (vs 32K elsewhere — long few-shot prompts may
      truncate); slower on Apple Silicon (Gemma 2 attention pattern
      is less Metal-friendly than Mistral / Qwen).
    quant: "Q4_K_M"
    size_gb: 17
    context_tokens: 8192
    refusal_rate: 3.0           # creative-RP-tuned but not abliterated
    strengths:
      - "Claude-style prose quality (Sonnet/Opus distillation)"
      - "editorial / RP narrative tuning"
      - "Gemma 2 base — different lineage from Cydonia (Mistral)"
      - "dense 27B — full capacity per token"
    families_recommended: ["all"]
    active: true

  qwen36_27b_heretic_neo_imatrix:
    backend: lm_studio
    lm_studio_id: "qwen3.6-27b-heretic-uncensored-finetune-neo-code-di-imatrix-max"
    # Round-18 — Qwen 3.5/3.6 thinking-mode finetunes emit a
    # `<think>...</think>` chain-of-thought block that's incompatible
    # with LM Studio's response_format:json_schema grammar. With this
    # flag set, LMStudioClient skips the response_format constraint
    # and falls back to free-form generation + Pydantic post-validation
    # (the reasoning trace goes to the response's `reasoning_content`
    # field, the actual JSON answer lands in `content`).
    is_reasoning_model: true
    display_name: "Qwen 3.6 27B Heretic NEO-Code DI (iMatrix Max)"
    description: >-
      27B-class community finetune of the Qwen 3.5/3.6 architecture
      family (file declares qwen35 arch). Heretic abliteration step
      removes refusal floor; "NEO-Code DI" is a code-distillation +
      domain-instruct tune; "iMatrix Max" denotes the importance-
      matrix calibrated GGUF quantization. 18.70 GB on disk.

      ROUND-19 EVAL OUTCOME (2026-05-22): registered but marked
      INACTIVE after retry with timeout + context tuning. Two
      separate impediments:

      (1) Memory ceiling — full 32K context allocation requires
          23 GB which LM Studio's memory guard blocks on this 48
          GB M4 Pro. Falling back to 16K context (17.4 GB) works
          for model load but doesn't leave enough headroom for
          our scene-generation batch pattern.

      (2) Context-window squeeze — for the 25-scene batch JSON,
          input (system+user prompt) is ~5K tokens; reasoning
          trace adds 2-3K; the 25-scene JSON array needs 8-10K.
          Total demands ~15-18K which doesn't fit 16K. The plan
          stage works (only 1 plan object, ~500 tokens). The scene
          stage truncates mid-batch. Facets also fail because each
          facet's reasoning + answer at num_predict=4096 still
          comes back with empty content (the model spends the
          entire budget on reasoning).

      The round-18 `is_reasoning_model: true` flag worked around the
      schema-grammar conflict. The round-19 bumps (plan
      num_predict 4096→8192, facet num_predict 2048→4096, LM Studio
      request timeout 900→3600) handled the timeout dimension. But
      the context-vs-memory trade-off doesn't have a fix on this
      hardware.

      Re-evaluate when: (a) LM Studio supports parallel reason+
      answer streaming, (b) a Qwen3 reasoning variant ships on the
      MoE backend (fewer active params = lower memory ceiling for
      bigger context), or (c) the hardware budget grows past 48 GB.
      Integration framework stays in place — when a viable
      reasoning model lands, just flip active to true.
    quant: "GGUF_iMatrix"
    size_gb: 19
    # Round-19 (2026-05-22) — context capped at 16384 because 32K
    # context allocation requested 23 GB which LM Studio's memory
    # guard blocked on this 48 GB M4 Pro. 16K context lands at
    # 17.4 GB, well inside budget. Our facet system prompt is ~5500
    # tokens, so 16K leaves plenty of headroom for the reasoning
    # trace + answer.
    context_tokens: 16384
    refusal_rate: 2.0           # heretic abliteration
    strengths:
      - "27B dense — would-be richer prose than 9B (untested due to inactive)"
      - "heretic abliteration (refusal-removed)"
      - "NEO-Code DI fine-tune (instruct discipline + code competence)"
      - "iMatrix-calibrated GGUF (better perplexity preservation)"
    families_recommended: ["all"]
    active: false  # round-19: re-evaluated — context-vs-memory squeeze blocks 25-scene batch (see description above)

  magnum_v4_12b:
    backend: lm_studio
    lm_studio_id: "magnum-v4-12b"
    display_name: "Magnum v4 12B (Mistral Nemo)"
    description: >-
      anthracite-org/magnum-v4-12b. Mistral Nemo 12B base
      fine-tuned on the same Claude-3-Sonnet/Opus distillation corpus
      as Magnum v4 27B, but on the smaller (and Apple-Silicon-friendlier)
      Mistral Nemo lineage rather than Gemma 2. The Magnum line is
      designed to replicate Claude prose for creative / RP narrative;
      Mistral Nemo's attention pattern is more Metal-friendly than
      Gemma 2 so this should run measurably faster on M-series than
      the 27B Gemma variant despite the smaller parameter gap.
      NOT abliterated — refusal-rate is managed via training-data
      selection rather than weight surgery, so the floor is higher
      than Cydonia heretic but the prose discipline + vocabulary
      adherence are typically stronger. Apache 2.0 (inherited from
      Mistral Nemo). Registered as the speed/quality sweet spot
      between Cydonia 24B (slow but disciplined) and qwen3.5-9b
      (fast but hallucinates vocab tags).
    quant: "Q4_K_M"
    size_gb: 7
    context_tokens: 32768
    refusal_rate: 3.0           # creative-RP-tuned, not abliterated
    strengths:
      - "Mistral Nemo base — Metal-friendly attention, ~2× Cydonia 24B throughput"
      - "Magnum tuning (Claude-3 Sonnet/Opus distillation)"
      - "structured-tag vocabulary discipline (Mistral lineage)"
      - "Q4_K_M GGUF — well-optimised for LM Studio's llama.cpp path"
    families_recommended: ["all"]
    active: true

  qwen35_9b_claude46_heretic_mlx:
    backend: lm_studio
    lm_studio_id: "qwen3.5-9b-claude-4.6-highiq-instruct-heretic-uncensored-mlx-mxfp8"
    display_name: "Qwen 3.5 9B Claude-4.6 HighIQ Heretic (MLX MXFP8)"
    description: >-
      Qwen 3.5 9B dense base, fine-tuned on a Claude 4.6 HighIQ-Instruct
      distillation corpus, then heretic-abliterated (refusal-removed).
      Shipped in MLX MXFP8 format — the first MLX-native entry in this
      registry, which means it runs through LM Studio's MLX runtime on
      Apple Silicon (skipping the llama.cpp / GGUF path the other
      LM Studio entries use). Round-16 registration (2026-05-21) for
      A/B against the 24B / 30B options that have dominated the
      Phase A wall-clock budget. Expectations: ~3x faster than
      Cydonia 24B, ~2x smaller in memory (10.17 GB on disk), refusal
      floor low (heretic step), creative-instruct tuning via Claude 4.6
      distillation. Trade-off vs the 24B/30B models: ~1/3 the
      parameter count → potentially shallower prose, but better
      throughput per scene on the facet-generation hot path.
    quant: "MXFP8"
    size_gb: 10
    context_tokens: 32768
    refusal_rate: 2.0           # heretic abliteration
    strengths:
      - "MLX native — fastest LM Studio path on Apple Silicon"
      - "9B dense — ~3x smaller / ~3x faster than 24B-class models"
      - "Claude 4.6 HighIQ-Instruct distillation"
      - "heretic abliteration (refusal-removed)"
      - "MXFP8 — high-precision 8-bit microscaling float"
    families_recommended: ["all"]
    active: true

  mlx_cydonia_v31_4bit:
    backend: mlx
    mlx_model_id: "mlx-community/Cydonia-24B-v3.1-4bit"
    display_name: "Cydonia 24B v3.1 (MLX 4-bit)"
    description: >-
      mlx-community's 4-bit quantization of TheDrummer/Cydonia-24B-v3.1
      (an earlier Cydonia v3.1 base, predates the v4.3 heretic-vision
      Ollama entry by 2 minor versions). Served via mlx_lm.server's
      OpenAI-compatible REST API on 127.0.0.1:8080. Apple-Silicon-
      native MLX runtime — typically faster per token than llama.cpp
      via Ollama for the same parameter count. Cached under
      ~/AI/models/hub/ (HF_HOME convention).

      Setup (one-time):
        mkdir -p ~/AI/envs && cd ~/AI/envs
        python3 -m venv mlx-env && source mlx-env/bin/activate
        pip install --upgrade pip
        pip install mlx mlx-lm
        export HF_HOME=~/AI/models  # add to ~/.zshrc

      Each session start:
        HF_HOME=~/AI/models ~/AI/envs/mlx-env/bin/mlx_lm.server \\
            --model mlx-community/Cydonia-24B-v3.1-4bit \\
            --host 127.0.0.1 --port 8080 --log-level INFO

      Each session end (BEFORE running ComfyUI render):
        pkill -f mlx_lm.server   # release ~17 GB unified memory

      Round-20 registration (2026-05-22). Notes vs the Ollama entry:
      v3.1 base is older than v4.3 (no heretic abliteration, no
      vision graft); refusal floor is the v3.1 Cydonia level
      (creative-tuned but not abliterated). Comparison run scheduled
      to confirm whether MLX speed compensates for the older base.
    quant: "4bit"
    size_gb: 13
    context_tokens: 32768
    refusal_rate: 3.0           # v3.1 base, no heretic step
    strengths:
      - "MLX runtime — typically faster per token than llama.cpp"
      - "24B Cydonia base — established creative prose tune"
      - "OpenAI-compatible REST API via mlx_lm.server"
    families_recommended: ["all"]
    active: true

  cydonia_v43_lm_studio:
    backend: lm_studio
    lm_studio_id: "thedrummer_cydonia-24b-v4.3"
    display_name: "Cydonia 24B v4.3 (LM Studio)"
    description: >-
      TheDrummer/Cydonia-24B-v4.3 served via LM Studio's
      OpenAI-compatible REST API. Same base lineage as the Ollama
      entry (Mistral Small 3.1 24B base → 3.2-Instruct → Cydonia v4.3
      creative-writing fine-tune) but WITHOUT the heretic-abliteration
      step + vision-graft that Fermi's Ollama variant ships. Refusal
      floor will be higher than cydonia_heretic_24b — useful as an
      A/B target to measure how much of the project's NSFW
      generation quality comes from the heretic tune vs the base
      Cydonia tune itself, and to measure LM Studio's MLX-backed
      inference speed against Ollama's llama.cpp path on Apple Silicon.
      Round-14 registration (2026-05-21).
    quant: "Q4_K_M"
    size_gb: 14
    context_tokens: 32768
    refusal_rate: 4.0           # non-abliterated; expect higher than heretic
    strengths:
      - "Cydonia creative-writing tune (base variant)"
      - "LM Studio MLX backend — typically faster on Apple Silicon"
      - "OpenAI-compatible response_format json_schema"
      - "different backend lineage from Ollama — A/B vs cydonia_heretic"
    families_recommended: ["all"]
    active: true

  qwen3_abliterated_30b:
    ollama_id: "huihui_ai/qwen3-abliterated:30b-a3b"
    display_name: "Qwen3 30B-A3B (Abliterated)"
    description: >-
      huihui-ai abliteration of Qwen/Qwen3-30B-A3B-Instruct-2507.
      Mixture-of-experts: 30.5B total params across 128 experts,
      8 experts activated per token (~3.3B active), ~19GB on disk
      at Q4_K_M. Compute behaves like a 3B model while capacity
      behaves like a 30B — fast inference per token at high
      capacity. Apache 2.0 (inherited from the Qwen3 base).
      Abliteration via the remove-refusals-with-transformers
      method drops the refusal floor for explicit-tier work.
      Different lineage from Cydonia (Qwen vs Mistral) — used as
      the fallback model so the second-chance retry diversifies
      lineage. 32K native context, extensible to 131K with YaRN
      (pipeline uses native 32K).
    quant: "Q4_K_M"
    size_gb: 19
    context_tokens: 32768
    refusal_rate: 2.0           # abliterated
    strengths:
      - "low refusal floor (abliterated)"
      - "MoE — 3.3B active params per token for fast inference"
      - "high-capacity (30.5B total) with 3B-class latency"
      - "different lineage from Cydonia (Qwen vs Mistral) — A/B + fallback target"
      - "32K context"
    families_recommended: ["all"]
    active: true

  # ---------------------------------------------------------------------------
  # To add another LLM: ollama pull <tag>, then add an entry below mirroring
  # the shape above. Set active: true to make it routable. Setting it as
  # default_llm makes it the project-wide default.
  # ---------------------------------------------------------------------------

# Default LLM used when --llm flag is omitted on the CLI and no per-role
# routing entry in pipeline.yaml::llm.routing applies. Must be the registry
# id (not the ollama_id) of an active entry above.
default_llm: cydonia_heretic_24b

# Fallback LLM — used by ``OllamaClient.generate_json(fallback_model=...)``
# when the primary model fails twice in a row (constrained-decoding +
# Pydantic validation both reject the response). The retry path is opt-in;
# agents pass ``fallback_model=router.fallback().ollama_id`` per call.
# Must be a registry id of an active entry above. Set to a DIFFERENT id from
# default_llm to gain diversity on the retry; set to the same id to collapse
# the fallback dimension (single-LLM operation).
fallback_llm: qwen3_abliterated_30b
