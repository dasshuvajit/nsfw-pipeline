# =============================================================================
# NSFW Content Generation Pipeline — Default Configuration
# Source: ARCHITECTURE.md Appendix B
# =============================================================================
# All weights/thresholds in this file are starting defaults. Phase 2 instructs
# us to replace mode_weights and content_level_weights with REAL data from
# the posts table once enough engagement signals are collected.
# =============================================================================

pipeline:
  runs_per_day: 3
  output_dir: "output"
  db_path: "nsfw_pipeline.db"
  # Default render model. Override per-command with --models <id>.
  # Must match an id under config/models/*.yaml. Changed 2026-05-20
  # from juggernaut_ragnarok to gonzalomo_chroma_v30 (chroma family).
  default_model_id: "gonzalomo_chroma_v30"
  # Default style profile archetype. Must match a key under profiles:
  # in config/style_profiles.yaml.
  default_style_profile_id: "golden_hour_natural"

execution:
  mode: automated           # manual|supervised|automated
  pause_after_dryrun: true
  pause_after_filter: true

mode_weights:
  # 2026-05-20: character mode deleted; remaining 4 modes proportionally
  # rescaled ×2.5 (preserves the prior relative ordering until usage
  # data justifies a tilt).
  theme: 0.50
  niche: 0.25
  style: 0.125
  variation: 0.125

content_level_weights:
  # Sale-tier distribution: bias toward the two tiers DA Premium Gallery
  # actually sells (T2/T3); T1 and T4 are rarer.
  T1_suggestive: 0.10
  T2_implied:    0.35
  T3_artnude:    0.45
  T4_explicit:   0.10

aspect_ratio_weights:
  # T1/T2 share the "tasteful" distribution (more variety).
  # T3/T4 skew portrait — full-body nudes and explicit framing sell tall.
  T1_suggestive:
    portrait_23: 0.45
    portrait_916: 0.20
    square: 0.25
    landscape: 0.10
  T2_implied:
    portrait_23: 0.45
    portrait_916: 0.20
    square: 0.25
    landscape: 0.10
  T3_artnude:
    portrait_23: 0.55
    portrait_916: 0.20
    square: 0.20
    landscape: 0.05
  T4_explicit:
    portrait_23: 0.55
    portrait_916: 0.20
    square: 0.20
    landscape: 0.05

generation:
  batch_size: 1

set_builder:
  min_images: 10
  max_images: 25
  quality_cutoff: 0.55       # Minimum composite score

scoring:
  # Phase G — human-preference scorers. Both ship OFF by default; flip
  # to true after installing the heavyweight packages (see
  # ``requirements.txt``) and downloading model weights. With both
  # disabled the composite collapses back to the legacy 4-signal
  # formula (aesthetic+blur+face+resolution) — verified by
  # ``CompositeWeights.legacy()`` in ``src/scoring/image_scorer.py``.
  use_hps_v2: false           # ~600MB weights, research-only license
  use_image_reward: false     # ~400MB weights, Apache-2.0
  # Phase-G composite weights (used when at least one Phase-G scorer is
  # enabled). When a per-image signal is None (predictor disabled or
  # graceful-fallback fired), its weight is redistributed across the
  # remaining signals so the composite always lands in [0, 1].
  composite_weights:
    hps_v2:       0.30
    image_reward: 0.25
    aesthetic:    0.20         # LAION CLIP — kept as the cheap floor
    face:         0.10
    blur:         0.10
    resolution:   0.05
  # Legacy weights (active when both Phase-G flags are off). Sum = 1.0.
  legacy_weights:
    aesthetic_weight:  0.40
    blur_weight:       0.25
    face_weight:       0.25
    resolution_weight: 0.10

dedup:
  prompt_similarity_threshold: 0.9
  scene_structural_threshold: 0.75  # Cross-level dedup

llm:
  base_url: "http://localhost:11434"
  unload_after_phase: true
  keep_alive_seconds: 0
  # Per-request HTTP timeout (seconds) for Ollama /api/generate +
  # /api/chat calls. Default 900s (15 min) is sized for 70B-class
  # models on M4 Pro under unified-memory pressure; 24B-class models
  # finish well under this. Bump higher if you observe ReadTimeout
  # errors with even larger models.
  request_timeout_seconds: 900

  # The default LLM for the project lives in config/llm_models.yaml under
  # `default_llm:`. Override per-command with the --llm <id> flag. List
  # available ids with `python scripts/list_models.py`.

  # Per-role routing — fires ONLY when --llm is omitted on the CLI. When
  # --llm is specified it overrides every role for that one command run.
  # All values must be registry IDs from config/llm_models.yaml (NOT raw
  # Ollama strings — the router resolves to the Ollama tag at call time
  # so editing the tag in the registry propagates everywhere automatically).
  #
  # Current state (2026-05-19): ROUTING DISABLED. Every role falls back to
  # default_llm (cydonia_heretic_24b) — the heretic-tuned variant already
  # carries a low refusal floor, so the prior split (venice_24b for facets,
  # cydonia for planner) is no longer needed. Re-enable per-role routing
  # only if a future evaluation shows a specific role benefits from a
  # different LLM.
  #
  # Examples (uncomment + customise if needed):
  # 2026-05-23 — dual-write A/B verdict. Both Cydonia 24B and
  # DavidAU 12B :3 (32K context instance) produce excellent dual-
  # write output. Empirical scores on the same 10-scene T4 themes:
  #
  #   DavidAU :3 (32K):  avg 9.40/10, 10/10 excellent, 627s wall-clock
  #   Cydonia 24B    :  avg 9.35/10, 9/10 excellent,  1709s wall-clock
  #
  # DavidAU is 2.7x faster AND scores marginally higher. User
  # preference: "I mainly want to use [DavidAU] if it works perfectly".
  # Verdict: DavidAU is primary (falls through to default_llm).
  # Cydonia stays available as fallback_llm in llm_models.yaml.
  #
  # IMPORTANT: DavidAU's lm_studio_id is pinned to ":3" suffix (the
  # 32K-context instance). LM Studio has multiple loaded instances at
  # different contexts; the bare base id routes to :1 (4K) which
  # can't fit the dual-write system prompt.
  routing: {}
    # series_planner:    cydonia_heretic_24b
    # scene_generator:   cydonia_heretic_24b
    # metadata_generator: cydonia_heretic_24b

# Round-14 (2026-05-21) — LM Studio backend. The pipeline's LLM client
# pool dispatches by `backend:` on each entry in config/llm_models.yaml;
# entries with `backend: lm_studio` route through this block. Standard
# LM Studio install on macOS exposes the OpenAI-compatible REST API at
# the URL below and ships an `lms` CLI at the path below for model
# load / unload.
#
# To use LM Studio:
#   1. Install LM Studio.app (https://lmstudio.ai)
#   2. Start the local server (Server tab → Start)
#   3. Download the model in the LM Studio UI (Discover tab)
#   4. Register the entry in config/llm_models.yaml with backend=lm_studio
#      and lm_studio_id matching the model identifier shown in `lms ls`
#   5. Reference the registry id with --llm <id>
# Round-20 (2026-05-22) — MLX backend. The pipeline routes
# entries with `backend: mlx` in config/llm_models.yaml through
# the mlx_lm.server OpenAI-compatible REST API. Unlike Ollama
# (which auto-starts via the daemon) and LM Studio (which runs
# as a long-lived GUI app), mlx_lm.server is a foreground process
# the operator starts manually:
#
#   HF_HOME=~/AI/models ~/AI/envs/mlx-env/bin/mlx_lm.server \
#       --model mlx-community/Cydonia-24B-v3.1-4bit \
#       --host 127.0.0.1 --port 8080 --log-level INFO
#
# The server hosts EXACTLY ONE model per process — switching LLMs
# means restarting it. The pipeline's preflight verifies the
# server is reachable; the operator is responsible for matching
# the loaded model to the `--llm` flag passed to prepare_prompts.
#
# Phase B (ComfyUI render) requires unified memory to be freed
# before the diffusion checkpoint loads. mlx_lm.server has no HTTP
# unload endpoint, so the operator must stop the server process
# (`pkill -f mlx_lm.server`) between Phase A and Phase B.
mlx:
  base_url: "http://127.0.0.1:8080"
  # Per-request HTTP timeout (seconds). MLX on Apple Silicon is
  # typically fast per token but a long facet prompt + cold prompt-
  # cache miss can still take a few minutes.
  request_timeout_seconds: 900
  # Optional metadata — operator command for documentation; the
  # pipeline doesn't auto-start the server. Edit for your install.
  python_bin: "~/AI/envs/mlx-env/bin/python"
  hf_home: "~/AI/models"

lm_studio:
  base_url: "http://localhost:1234"
  # Per-request HTTP timeout (seconds) for /v1/chat/completions calls.
  # Round-19 (2026-05-22) bumped 900 → 3600 to accommodate reasoning
  # models whose <think>...</think> trace can eat 30+ minutes on a
  # scene-generation call for a 27B+ dense model. Non-reasoning models
  # don't use the extra headroom.
  request_timeout_seconds: 3600
  # Path to the `lms` CLI binary — used for `lms unload --all` between
  # Phase A and Phase B. Standard LM Studio install drops it under
  # ~/.lmstudio/bin/lms; edit if your install differs.
  lms_binary: "~/.lmstudio/bin/lms"

# Remote OpenAI-compatible API backend — any /v1/chat/completions gateway
# (OpenRouter, OpenAI, DeepSeek, GLM/Zhipu, Together, Groq, ...). DORMANT by
# default: base_url is empty, so the backend is unavailable until you point it
# at a provider. To enable, set base_url + the api-key env var below and add a
# `backend: openai_compatible` entry in llm_models.yaml. The API key is read
# from the env var named below and is NEVER stored here — set it in your shell
# profile / a gitignored .env, e.g.:
#   export OPENAI_COMPATIBLE_API_KEY="sk-..."
# Example base_urls (full OpenAI base, incl. /v1):
#   OpenRouter → https://openrouter.ai/api/v1
#   OpenAI     → https://api.openai.com/v1
#   DeepSeek   → https://api.deepseek.com/v1
#   GLM/Zhipu  → https://open.bigmodel.cn/api/paas/v4
# NOTE: frontier API models are CENSORED for explicit NSFW — this backend is for
# non-explicit / experimentation; the local default stays the explicit engine.
# Reachable only via --llm <id> / --model-tag (default_llm is unchanged).
openai_compatible:
  base_url: ""                              # set a provider base_url to enable
  api_key_env: "OPENAI_COMPATIBLE_API_KEY"  # env var holding the API token
  request_timeout_seconds: 600
  # Send response_format:{"type":"json_object"} for schema'd non-reasoning calls
  # (a light JSON nudge; widely supported). Reasoning models skip it automatically.
  use_json_object: true

comfyui:
  base_url: "http://127.0.0.1:8188"
  # Where ComfyUI writes its rendered images on disk. Used by ComfyUIClient
  # to resolve the file paths returned by /history/{prompt_id}. NOT in
  # Appendix B — added because the install location varies per machine
  # (this dev box runs ComfyUI from ~/AI/apps/ComfyUI). Edit this for your
  # own install. ~ is expanded by Path.expanduser().
  output_dir: "~/AI/apps/ComfyUI/output"
  # ComfyUI's LoadImage node reads from this directory (NOT from the
  # project tree). Reserved for future LoadImage-style nodes in
  # external templates. Sibling of output_dir on standard installs.
  # Edit this for your install. ~ is expanded by Path.expanduser().
  input_dir: "~/AI/apps/ComfyUI/input"
  render_timeout_seconds: 900
  max_retry_per_image: 3
  workflow_dir: "config/comfyui_workflows"

# Staged render pipeline (2026-06-02). art_series runs the base stage for
# ALL prompts (Chroma resident), then the refine stage for ALL base outputs
# (SDXL DMD resident) — the two model domains are never co-resident, which
# avoids the ~21GB swap the monolith hit on the 48GB M4 Pro. 4K is a SEPARATE
# manual step (scripts/upscale_folder.py) run only on hand-picked keepers —
# never auto-run in a series (4K USDU is ~66% of render cost; don't spend it
# on culls). See docs/COMFYUI_WORKFLOWS.md § Staged pipeline.
render_pipeline:
  base_template:       "templates/chroma/base.json"      # stage 1 (Chroma)
  refine_template:     "templates/chroma/refine.json"    # stage 2 (SDXL refine: hands+nipples)
  refine_template_t4:  "templates/chroma/refine_T4.json" # stage 2 T4 variant (+ vagina detailer); main images only
  upscale_template:    "templates/sdxl/upscale_4k.json"  # stage 3 (manual; SFW)
  # Base-only by DEFAULT (2026-06-21): the SDXL detailer refine is opt-in, like 4K
  # (art_series --refine to enable). Keeps a series on one resident model — no
  # zimage<->SDXL swap thrash. false -> review images are the raw base render.
  enable_refine: false
  target_4k_long_edge: 3840
  # Base resolution per orientation (overrides art_series ORIENTATIONS when the
  # staged pipeline is active). Reverted to the model's native 896x1152 portrait:
  # 4K is reached in the separate upscale stage now, so the base no longer needs
  # the 1024x1536 that made the monolith's x1.25x2.0 math land on 3840.
  base_resolution:
    portrait:  [896, 1152]
    square:    [1024, 1024]
    landscape: [1152, 896]

# NOTE: the old model_lanes: block was removed on 2026-04-08 when the
# model_registry SQLite table landed. The registry is now the single
# source of truth for "which checkpoints exist + their capabilities".
# See docs/COMFYUI_WORKFLOWS.md and `python scripts/list_models.py`.

watermark:
  enabled: true
  text: "@MaisonLumiere"
  position: "bottom-right"         # bottom-right|bottom-left|top-right|top-left
  opacity: 0.3                     # 0.0 = invisible, 1.0 = fully opaque

# Cinematic post-grade (src/postprocess/grader.py) — the deterministic finishing
# layer that adds the filmic look Z-Image/Chroma under-render (warm high-contrast
# grade + highlight bloom/halation + vignette + grain). Runs in _package() on the
# public AND gated sets, AFTER render and BEFORE watermark. Pure CPU. Disable per
# run with --no-postgrade. 4K is graded post-USDU, never here (2026-06-18 R&D).
postgrade:
  enabled: true
  strength: 0.6          # 0..1 blend with the ungraded render (R&D sweet spot 0.5-0.7)
  warmth: 0.06           # warm-highlight / teal-shadow split-tone amount
  contrast: 0.12         # filmic S-curve strength
  shadow_lift: 0.02      # gentle filmic shadow lift
  bloom: 0.18            # warm highlight halation/bloom amount
  bloom_threshold: 0.72  # luma above which highlights bloom
  vignette: 0.18         # corner darkening
  grain: 0.015           # film-grain sigma (0 = off)

# postprocess block deleted 2026-05-20 with the Upscaler + FaceRefiner
# modules. Post-processing (upscale, face-detailer) goes inside external
# templates from now on — gonzaLomo_Chroma_Refiner_v11.json already does
# the FaceDetailer pass after its SDXL refiner stage.

variation_mode:
  axis_weights:
    pose: 0.40
    camera: 0.30
    lighting: 0.20
    expression: 0.10
  multi_base:
    enabled: false
    max_bases: 3
    min_source_quality: 0.7

# Compliance gate. When commercial_mode is true the model registry
# refuses to register any model whose YAML declares
# ``commercial_use: false`` (e.g. the FLUX NCL-licensed FLUX.2 Klein 9B
# tier). Pipeline output feeds paid platforms (DA Premium, Patreon,
# Fanvue); non-commercial licenses would be an actionable violation.
# Leave this false for personal / research / non-commercial runs; flip
# it to true only when every selected model is commercially licensed.
compliance:
  commercial_mode: false
