  # ── FLUX.2 Klein 9B (distilled, Qwen3-8B text encoder, 32-ch VAE) ─────
  # Step-distilled + guidance-distilled from FLUX.2-[dev] 32B. No
  # FluxGuidance node, cfg must be 1.0, sampler=euler scheduler=simple
  # steps=4 — these are contract, not preference. Negatives ignored.
  # LoRAs from FLUX.1 are architecturally INCOMPATIBLE (different attn
  # dims + encoder). Prose-only prompting per BFL Klein 9B guide:
  # Subject → Setting → Details → Lighting → Atmosphere, 30–80 words.
  # License: FLUX NCL (non-commercial only for the 9B tier).
  flux2:
    prompt_style: flux2_prose
    default_render_model: null
    default_template: null
    quality_prefix: []
    quality_suffix: []
    # Klein 9B is distilled — no FluxGuidance, negatives ignored.
    # subject_count axis stays empty for the same reason (Klein can't
    # honour negative tokens). The pipeline relies on the positive-side
    # solo_anchor prose + LLM directive for single-subject enforcement.
    negative_axes:
      anatomy: []
      medium: []
      skin: []
      quality: []
      watermark: []
      safety: []
      censor: []
      subject_count: []
    supports_negative_prompt: false
    supports_weighting: false
    clip_skip: 1
    max_tokens: 512
    # Klein 9B uses Qwen3-8B as its text encoder; Qwen3 tokenizer files
    # are large to ship for token-counting alone. The heuristic
    # (words × 1.4) is approximate but Klein is distilled / no
    # FluxGuidance, so a tight cap matters less here than for CLIP.
    tokenizer_id: heuristic
    structure_rules: >-
      Prose only, single paragraph, 30–80 words. Five anchors in order:
      subject → setting → details → lighting → atmosphere. No tags, no
      weighting syntax, no BREAK. Word order matters — subject and
      lighting belong near the front. Lighting is the highest-impact
      lever; be explicit about direction, colour temperature, quality.
    avoid_words:
      - masterpiece
      - "best quality"
      - 8k
      - 4k
      - absurdres
      - score_9
      - score_8_up
    llm_temperature: 0.8
    llm_hint: >-
      Emit scene fields as natural-English prose ready to stitch into a
      BFL-ordered paragraph (subject, setting, details, lighting,
      atmosphere). Never use weighting like (word:1.3) or tag
      underscores. Keep the lighting clause specific — name the key
      direction, colour temperature, and whether it is hard or soft.
    example_prompt: >-
      A confident woman in her late twenties stands against a matte
      charcoal wall in a loft studio. She wears a cream silk slip dress
      with visible weave texture. A single hard key light at camera
      left, warm tungsten at 3200 K, rakes across her collarbone,
      leaving the opposite cheek in deep shadow. Air feels still,
      faintly smoky.
    # IMPORTANT (vocab_version 5 — 2026-05-18): pre-fix the flux2
    # examples used FREE-TEXT prose in lighting_directive, but the
    # canonicalizer expects an ENUM TAG (LIGHT_*) and silently
    # dropped the prose. The LLM mirrored this bug → every flux2
    # render lost the canonicalizer thread for lighting. Corrected
    # below; subject_focus stays free-text (it IS a free-text field).
    examples:
      - tier: T2_implied
        scene:
          pose: standing against a wall
          camera: medium shot
          lighting: warm tungsten key from left
          environment_detail: loft studio with charcoal walls
          mood_note: calm and elegant
        expected_facet:
          scene_prose: "A confident woman in her late twenties stands against a matte charcoal wall in a loft studio. She wears a cream silk slip dress with visible weave texture. A single hard key light at camera left, warm tungsten at 3200 K, rakes across her collarbone, leaving the opposite cheek in deep shadow."
          subject_focus: "Woman, late 20s, cream silk slip"
          realism_camera: CAMERA_SONY_A7RV
          realism_lens: LENS_85MM_F14
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_EDITORIAL_FASHION
          lighting_directive: LIGHT_SPLIT
          mood_aesthetic: MOOD_CONFIDENT
          narrative_moment: NARR_COFFEE_MORNING_PAPER
      - tier: T3_artnude
        scene:
          pose: reclined on side
          camera: close-up
          lighting: golden hour rim
          environment_detail: linen sheets on a low platform bed
          mood_note: intimate and unhurried
        expected_facet:
          scene_prose: "A woman reclines on her side on a low platform bed, draped in a sheer linen sheet that partially covers her form. Golden hour light pours through a tall window from the right, warming her skin and casting long soft shadows across the linen. The atmosphere is intimate and unhurried."
          subject_focus: "Woman, reclined, partially covered by linen sheet"
          realism_camera: CAMERA_LEICA_M11
          realism_lens: LENS_85MM_F14
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_FINE_NUDE
          lighting_directive: LIGHT_GOLDEN_HOUR
          mood_aesthetic: MOOD_INTIMATE
          narrative_moment: NARR_JUST_WOKEN_TANGLED_SHEETS
          environment_setting: ENV_MORNING_BEDROOM
          environment_atmosphere: ATM_DUST_MOTES_IN_LIGHT
          nsfw_anatomy: NSFW_BREAST_NATURAL
          nsfw_posture: NSFW_RECLINED_NUDE
      - tier: T4_explicit
        scene:
          pose: lying back
          camera: medium close-up
          lighting: warm overhead practical
          environment_detail: rumpled white sheets
          mood_note: sultry and direct
        expected_facet:
          scene_prose: "A fully nude adult woman lies on her back on rumpled white cotton sheets, one knee raised, the other extended. Bare breasts and natural nipples are visible. She holds the camera's gaze with a sultry, level expression. A single warm overhead practical light spills directly across her bare skin and the bedding, sculpting the curves of her collarbone, ribs, and thigh into a fine-art nude composition."
          subject_focus: "Fully nude adult woman, lying back, knee raised, bare breasts visible, direct gaze"
          realism_camera: CAMERA_SONY_A7RV
          realism_lens: LENS_50MM_F18
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_FINE_NUDE
          lighting_directive: LIGHT_SOFT_FILL
          mood_aesthetic: MOOD_SENSUAL
          narrative_moment: NARR_JUST_WOKEN_TANGLED_SHEETS
          environment_setting: ENV_MORNING_BEDROOM
          environment_atmosphere: ATM_DUST_MOTES_IN_LIGHT
          nsfw_anatomy: NSFW_FULL_NUDE
          nsfw_posture: NSFW_RECLINED_NUDE
          nsfw_act: NSFW_T4_SOLO_GAZE
    guide:
      structure_order: [subject, setting, details, lighting, atmosphere]
      target_words: [30, 80]
      lighting_is_critical: true

  # ── Chroma (Flux-schnell fork, re-trained with CFG) ───────────────────
  # Same composer as flux BUT supports negatives (Chroma restored CFG).
  # T5 window is 256 (Schnell-derived), not 512.
  chroma:
    prompt_style: flux_natural
    # Default render model + template for the chroma family (D6 + D7).
    # render_prompts.py uses these when --models / --templates are omitted.
    default_render_model: gonzalomo_chroma_v30
    default_template: templates/chroma/gonzaLomo_Chroma_Refiner_v11.json
    quality_prefix: []
    quality_suffix: []
    # Negative-axis vocabulary aligned with the official ChromaPipeline
    # diffusers example (verified 2026-05-17):
    #   "low quality, ugly, unfinished, out of focus, deformed,
    #    disfigure, blurry, smudged, restricted palette, flat colors"
    # Plus NSFW-specific watermark/anatomy axes. Effective only when
    # CFG > 1 — vanilla Schnell ignores negatives entirely; finetunes
    # like Chroma1-HD honour them above guidance_scale=1.
    negative_axes:
      anatomy:
        - bad anatomy
        - bad hands
        - deformed
        - disfigure
        - mutation
        - extra limbs
        - missing limbs
      medium: []
      skin: []
      quality:
        - low quality
        - ugly
        - blurry
        - out of focus
        - smudged
        - unfinished
        - flat colors
        - restricted palette
      watermark:
        - watermark
        - signature
        - text
      safety: []
      censor: []
      # subject_count (2026-05-17) — single-female-only enforcement.
      # Chroma supports negatives at CFG > 1; prose-shaped tokens
      # because T5 prefers natural-language fragments over booru tags.
      # `partnered` deliberately NOT included — the positive-side vocab
      # filter (vocabulary.py::_SOLO_MODE_BANNED_TAGS) already removes
      # the canonicalised partnered phrasing from the positive prompt,
      # so the negative would just thrash with filter_conflicts.
      subject_count:
        - two people
        - multiple people
        - a couple
        - group
        - crowd
        - another person
    supports_negative_prompt: true
    supports_weighting: false
    clip_skip: 1
    # T5-XXL window for Chroma — the official diffusers ChromaPipeline
    # uses max_sequence_length=512 (verified 2026-05-17 against
    # huggingface/docs/diffusers/api/pipelines/chroma). Earlier 256 was
    # too restrictive; bumped to 512 so longer scene prose isn't truncated.
    max_tokens: 512
    tokenizer_id: t5
    structure_rules: >-
      Same prose style as Flux but shorter — stay under ~200 words.
      Chroma supports negative prompts (unlike vanilla Schnell).
    avoid_words: [score_9, score_8_up, masterpiece, "best quality"]
    # "period" = append realism tail as period-separated fragments:
    #   ". f/1.8. 35mm. photographic. natural skin texture."
    # The lodestones HF card + top Chroma Civitai workflows consistently
    # use this shape; comma-joining the tail degrades realism. Note:
    # tail uses "photographic" (not "photorealistic") per civitai
    # community guidance — "photorealistic" pushes toward photorealistic
    # ART rather than real photos.
    realism_tail_style: period
    llm_temperature: 0.75
    llm_hint: >-
      Natural-English prose, concise. Same as Flux but shorter — aim
      for 2-3 flowing sentences (under ~120 words). Weave pose,
      lighting, lens, environment, mood into prose. NO comma-keyword
      lists, NO weighting syntax, NO underscored tokens. The composer
      will automatically append the photographic realism tail
      (f/1.8. 35mm. photographic. natural skin texture.) — do NOT
      emit it yourself.
    example_prompt: >-
      A confident woman standing in a modern loft apartment with soft
      window light illuminating her features, realistic skin texture
      with natural pores, a cinematic depth of field, warm and elegant
      atmosphere.
    # Few-shot exemplars: CLEAN prose only — no period-tail, no
    # "photorealistic". The composer auto-appends
    # ". f/1.8. 35mm. photographic. natural skin texture." at compose
    # time. Showing the tail in the exemplar trains the LLM to emit a
    # duplicate tail, which doubles up in the final prompt.
    examples:
      - tier: T2_implied
        scene:
          pose: standing relaxed
          camera: medium shot
          lighting: soft window light
          environment_detail: modern loft
          mood_note: calm
        expected_facet:
