# Model-family prompting rules (ARCHITECTURE.md §6 / ARCHITECTURE.md §14).
#
# Every per-model YAML in config/models/*.yaml references one of these
# via its `family:` key. The PromptBuilder + scene_generator read this
# file at startup to decide:
#   - which composer to run (prompt_style)
#   - what quality prefix/suffix to inject
#   - whether negatives, weighting, clip_skip are meaningful
#   - what the LLM system-prompt hints should say
#
# Research sources (verified 2025–2026):
#   - Pony V6: AstraliteHeart model card → 6-tier score prefix + source_*
#     tag is mandatory, clip_skip=2.
#   - Illustrious XL: OnomaAI model card → quality suffix is
#     "masterpiece, best quality, amazing quality, very aesthetic, newest".
#     Some LLMs hallucinate a typo here — always double-check sources.
#   - Flux.1 Dev/Schnell: Black Forest Labs docs → CFG-distilled, negatives
#     are no-ops, T5 encoder window is 512 (Dev) / 256 (Schnell).
#   - Chroma (lodestones HF): Flux-schnell fork re-trained WITH CFG, so
#     negatives DO work. T5 window is 256 (inherits from Schnell).

families:
  # ── SDXL (Juggernaut, Lustify, Jib, MOP, Gonzalomo Photo) ──────────────
  sdxl:
    prompt_style: sdxl_keywords
    # Per-family default render template + default render model
    # (added 2026-05-20). Used by render_prompts.py when --templates is
    # omitted. null means the user hasn't authored an external template
    # for this family yet — render_prompts will require --templates and
    # raise a clear error otherwise. Add a template under
    # config/comfyui_workflows/templates/sdxl/ and point this at it.
    default_render_model: null
    default_template: null
    quality_prefix: []
    quality_suffix: []
    # Phase D — 7-axis negative taxonomy. Per-model YAMLs can extend or
    # override individual axes via prompt.extend.negative_axes.{axis}.
    # Tokens here are bucketed from the pre-Phase-D flat string; token
    # set is preserved so the flattened form matches byte-for-byte at
    # the set level (order may differ; assembler dedups case-insensitive).
    negative_axes:
      anatomy:
        - bad anatomy
        - distorted face
        - extra limbs
        - deformed hands
        - extra fingers
        - missing fingers
        - disfigured
        - mutation
        - poorly drawn face
        - poorly drawn hands
      medium:
        - cartoon
      skin:
        - oversharpened
        - plastic skin
      quality:
        - blurry
        - low quality
        - unrealistic lighting
        - noise
        - artifacts
        - low resolution
        - out of frame
        - cropped badly
        - duplicate
        - ugly
      watermark:
        - watermark
        - text
        - logo
      safety: []
      censor: []
      # subject_count (2026-05-17) — single-female-only enforcement.
      # Booru-shaped tokens since SDXL realism finetunes recognise the
      # canonical danbooru subject-count vocabulary even when the rest
      # of the prompt is keyword-style. Exempt from filter_conflicts.
      subject_count:
        - 2girls
        - 3girls
        - multiple_girls
        - multiple_subjects
        - group
        - crowd
    supports_negative_prompt: true
    supports_weighting: true
    clip_skip: 1
    max_tokens: 77
    tokenizer_id: clip
    structure_rules: >-
      Comma-separated descriptive keywords. Subject first, then scene,
      lighting, camera/lens, style. Light prose fragments are fine; avoid
      run-on sentences. Camera names (85mm f/2.8, bokeh) help realism.
    # Realism-fine-tuned SDXL checkpoints (Juggernaut / CyberRealistic /
    # RealVis) were trained AWAY from anime quality tokens. Leaving
    # these in a prompt measurably degrades realism (softer skin, glossy
    # plastic feel, painted faces). Strip them in the composer.
    avoid_words: [masterpiece, "best quality", 8k, 4k, absurdres]
    llm_temperature: 0.7
    llm_hint: >-
      Write scene fields as short descriptive noun phrases that stitch
      cleanly into a comma-separated keyword list.
    example_prompt: >-
      1girl, long hair, looking at viewer, soft window light, 85mm lens,
      shallow depth of field, cinematic, photorealistic, detailed skin
    # Q8 — tier-stratified few-shot examples. SceneFacetGenerator picks
    # the closest-tier example at compose time so the LLM sees a
    # same-tier exemplar (T4 facets get T4 examples, etc.).
    # IMPORTANT (vocab_version 5 — 2026-05-18): the structured enum-tag
    # fields below (lighting_directive, mood_aesthetic, realism_camera/
    # lens/film_stock/art_style_reference, nsfw_anatomy/posture/act)
    # carry the ABSTRACT CONCEPT TAG (e.g. ``LIGHT_GOLDEN_HOUR``), NOT
    # free-text prose. The canonicalizer in src/prompt/vocabulary.py
    # translates each tag into the family-shaped phrasing at compose
    # time. Free-text in these fields is silently dropped — the LLM
    # learns from these examples so they must demonstrate the exact
    # convention. See config/prompt_vocabulary.yaml for the menu.
    examples:
      - tier: T2_implied
        scene:
          pose: standing relaxed
          camera: medium shot
          lighting: soft window light
          environment_detail: minimalist bedroom by the window
          mood_note: calm and contemplative
        expected_facet:
          camera_spec: "85mm f/1.8, shallow depth of field, soft natural bokeh"
          clothing: "ivory silk slip, lace trim at neckline"
          realism_camera: CAMERA_SONY_A7RV
          realism_lens: LENS_85MM_F14
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_EDITORIAL_FASHION
          lighting_directive: LIGHT_WINDOW_SIDE
          mood_aesthetic: MOOD_SERENE
          narrative_moment: NARR_COFFEE_MORNING_PAPER
      - tier: T3_artnude
        scene:
          pose: reclined on side, three-quarter view
          camera: close-up
          lighting: golden hour rim light from the window
          environment_detail: linen sheets on a low platform bed
          mood_note: intimate and unhurried
        expected_facet:
          camera_spec: "85mm f/1.4, very shallow depth of field, smooth bokeh, fine skin detail"
          clothing: "draped sheer linen sheet, partially covering"
          realism_camera: CAMERA_LEICA_M11
          realism_lens: LENS_85MM_F14
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_FINE_NUDE
          lighting_directive: LIGHT_GOLDEN_HOUR
          mood_aesthetic: MOOD_INTIMATE
          narrative_moment: NARR_JUST_WOKEN_TANGLED_SHEETS
          environment_setting: ENV_MORNING_BEDROOM
          environment_atmosphere: ATM_DUST_MOTES_IN_LIGHT
          nsfw_anatomy: NSFW_BREAST_NATURAL
          nsfw_posture: NSFW_RECLINED_NUDE
      - tier: T4_explicit
        scene:
          pose: lying back, one knee raised
          camera: medium close-up, slightly above
          lighting: warm overhead practical, soft shadow
          environment_detail: rumpled white sheets in a low-key bedroom
          mood_note: sultry and direct
        expected_facet:
          camera_spec: "50mm f/1.4, shallow depth of field, sharp eyes, anatomically accurate skin, fine-art nude framing, bare breasts visible, natural nipples, mature adult female"
          clothing: "fully nude, no clothing, partially draped white sheet at hip exposing thigh and breasts"
          realism_camera: CAMERA_SONY_A7RV
          realism_lens: LENS_50MM_F18
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_FINE_NUDE
          lighting_directive: LIGHT_SOFT_FILL
          mood_aesthetic: MOOD_SENSUAL
          narrative_moment: NARR_JUST_WOKEN_TANGLED_SHEETS
          environment_setting: ENV_MORNING_BEDROOM
          environment_atmosphere: ATM_DUST_MOTES_IN_LIGHT
          nsfw_anatomy: NSFW_FULL_NUDE
          nsfw_posture: NSFW_RECLINED_NUDE
          nsfw_act: NSFW_T4_SOLO_GAZE

  # ── Pony V6 (CyberRealistic Pony, Pony Realism) ───────────────────────
  # MANDATORY 6-tier prefix + BREAK — verified against AstraliteHeart's
  # V6 model card. 3-tier prefixes (score_9, score_8_up, score_7_up) are
  # OUTDATED and produce visibly worse quality.
  pony:
    prompt_style: pony_danbooru
    default_render_model: null
    default_template: null
    quality_prefix:
      - score_9
      - score_8_up
      - score_7_up
      - score_6_up
      - score_5_up
      - score_4_up
      - BREAK
    quality_suffix: []
    negative_axes:
      anatomy:
        - bad anatomy
        - bad hands
        - imperfect eyes
        - skewed eyes
        - unnatural face
        - unnatural body
        - extra limb
        - missing limbs
      medium: []
      skin: []
      quality:
        - score_6
        - score_5
        - score_4
        - (worst quality:1.2)
        - (low quality:1.2)
        - (normal quality:1.2)
        - lowres
        - ugly
        - error
      watermark:
        - signature
        - watermark
      safety: []
      censor: []
      # subject_count (2026-05-17) — single-female-only enforcement.
      # Pony V6 / realism finetunes recognise the danbooru subject-count
      # vocabulary natively. Exempt from filter_conflicts so positive
      # `solo` doesn't cancel the negative-side suppression.
      subject_count:
        - 2girls
        - 3girls
        - multiple_girls
        - multiple_subjects
        - group
        - crowd
    supports_negative_prompt: true
    supports_weighting: true
    clip_skip: 2
    max_tokens: 77
    tokenizer_id: clip
    # Pony's BREAK token splits the prompt into two CLIP windows; each
    # window gets its own 75-token budget. The tokenizer respects this
    # when ``break_marker="BREAK"`` is passed to ``fit_to_budget``.
    break_marker: BREAK
    structure_rules: >-
      Booru-style tags, comma-separated. The 6-tier score prefix is
      prepended automatically — do NOT include score_* in your output.
      Include a source tag (source_anime, source_pony, source_furry, or
      source_cartoon) when relevant. CLIP skip is 2.
    avoid_words: [masterpiece, "best quality", "amazing quality", newest]
    # Booru tags want predictable structure — lower temp keeps the LLM
    # from freelancing and breaking tag conventions.
    llm_temperature: 0.4
    # Pony tag conventions don't say "adult woman" verbatim — booru
    # tagging uses ``1girl, mature_female, adult`` (canonical Danbooru
    # vocabulary; ``1woman`` is not a real Danbooru tag).
    # _positive_age_safety_scan inserts the keyword form for Pony.
    adult_anchor:
      keyword: "1girl, mature_female, adult"
      prose: "An adult woman with mature features."
    # Booru subject-count anchor — Pony recognises ``1girl`` + ``solo``
    # as canonical single-subject vocabulary. Injected by
    # _positive_solo_anchor_scan after the BREAK marker (so it lands in
    # CLIP window 2, not in window 1 alongside the score chain).
    # Kept short (2 tokens) to leave the 77-token CLIP budget for the
    # actual scene body.
    solo_anchor:
      keyword: "1girl, solo"
      prose: "A single adult woman alone in the scene."
    llm_hint: >-
      Use Danbooru-style tags (e.g. 1girl, long_hair, looking_at_viewer).
      Underscores between multi-word tags. No prose sentences. Do NOT
      include score_* tags — the composer adds them.
    example_prompt: >-
      1girl, long_hair, looking_at_viewer, soft_lighting, indoor,
      detailed_skin, source_anime
    # Pony schema (SceneFacetPony) does NOT carry realism_camera /
    # realism_lens / realism_film_stock / art_style_reference — booru
    # tag convention expresses photo realism via source_tag +
    # booru_tags inline. Lighting and mood DO have enum-tag fields and
    # the canonicalizer will inject family-shaped phrasing for them.
    examples:
      - tier: T2_implied
        scene:
          pose: standing relaxed
          camera: medium shot
          lighting: soft window light
          environment_detail: minimalist bedroom
          mood_note: calm
        expected_facet:
          booru_tags: "1girl, long_hair, looking_at_viewer, soft_lighting, lingerie, lace_trim, standing, indoors, detailed_skin"
          source_tag: "source_photograph"
          lighting_directive: LIGHT_WINDOW_SIDE
          mood_aesthetic: MOOD_SERENE
          narrative_moment: NARR_COFFEE_MORNING_PAPER
      - tier: T3_artnude
        scene:
          pose: reclined on side
          camera: close-up
          lighting: golden hour rim light
          environment_detail: linen sheets
          mood_note: intimate
        expected_facet:
          booru_tags: "1girl, long_hair, looking_at_viewer, lying, sheet, partially_clothed, golden_hour, soft_skin, breasts, detailed_skin"
          source_tag: "source_photograph"
          lighting_directive: LIGHT_GOLDEN_HOUR
          mood_aesthetic: MOOD_INTIMATE
          narrative_moment: NARR_JUST_WOKEN_TANGLED_SHEETS
          environment_setting: ENV_MORNING_BEDROOM
          environment_atmosphere: ATM_DUST_MOTES_IN_LIGHT
          nsfw_anatomy: NSFW_BREAST_NATURAL
          nsfw_posture: NSFW_RECLINED_NUDE
      - tier: T4_explicit
        scene:
          pose: lying back, one knee raised
          camera: medium close-up
          lighting: warm overhead light
          environment_detail: rumpled white sheets
          mood_note: sultry
        expected_facet:
          booru_tags: "1girl, mature_female, long_hair, looking_at_viewer, lying, on_back, knee_up, completely_nude, breasts, medium_breasts, nipples, navel, pussy, spread_legs, anatomically_correct, detailed_skin, intimate, fine_art_nude, bedroom, sheets"
          source_tag: "source_photograph"
          lighting_directive: LIGHT_SOFT_FILL
          mood_aesthetic: MOOD_SENSUAL
          narrative_moment: NARR_JUST_WOKEN_TANGLED_SHEETS
          environment_setting: ENV_MORNING_BEDROOM
          environment_atmosphere: ATM_DUST_MOTES_IN_LIGHT
          nsfw_anatomy: NSFW_FULL_NUDE
          nsfw_posture: NSFW_RECLINED_NUDE
          nsfw_act: NSFW_T4_SOLO_GAZE

  # ── Illustrious XL (Perfection Realistic ILXL, etc.) ──────────────────
  # Quality SUFFIX, not prefix. String is "masterpiece, best quality,
  # amazing quality, very aesthetic, newest" — the token is "aesthetic",
  # not "aware". Long negatives are strongly recommended.
  illustrious:
    prompt_style: illustrious_tags
    default_render_model: null
    default_template: null
    quality_prefix: []
    quality_suffix:
      - masterpiece
      - "best quality"
      - "amazing quality"
      - "very aesthetic"
      - newest
    negative_axes:
      anatomy:
        - bad anatomy
        - bad hands
        - extra digits
      medium: []
      skin: []
      quality:
        - lowres
        - worst quality
        - bad quality
        - jpeg artifacts
        - unfinished
        - displeasing
        - chromatic aberration
        - error
        - multiple views
        - fewer
        - extra
        - missing
        - scan
      watermark:
        - text
        - watermark
        - signature
        - username
      safety: []
      censor: []
      # subject_count (2026-05-17) — single-female-only enforcement.
      # Illustrious is "very sensitive to negative prompts" per community
      # guidance, so the subject_count tokens carry strong weight.
      subject_count:
        - 2girls
        - 3girls
        - multiple_girls
        - multiple_subjects
        - group
        - crowd
    supports_negative_prompt: true
    supports_weighting: true
    clip_skip: 1
    max_tokens: 77
    tokenizer_id: clip
    structure_rules: >-
      Hybrid: Danbooru-style tags first (1girl, character_name, attire),
      then short descriptive phrases for pose/environment/lighting.
      Quality suffix is appended automatically. Responds strongly to
      long negative prompts — do not shorten.
    avoid_words: [score_9, score_8_up, score_7_up]
    # Illustrious uses booru tag conventions for subject count —
    # ``1girl, solo`` is the canonical single-subject pair (matches Pony
    # convention). Per family_loader.py the default adult_anchor is
    # "adult woman, mature features" which is prose-shaped and doesn't
    # match Illustrious's tags-first composer convention. Explicit
    # override here.
    adult_anchor:
      keyword: "1girl, mature_female, adult"
      prose: "An adult woman with mature features."
    # Booru-shaped solo anchor (kept short — 2 tokens — to leave the
    # 77-token CLIP budget for scene body).
    solo_anchor:
      keyword: "1girl, solo"
      prose: "A single adult woman alone in the scene."
    # Hybrid tag + prose family — medium temp balances tag consistency
    # with a bit of prose variety.
    llm_temperature: 0.5
    llm_hint: >-
      Combine Danbooru tags with short descriptive phrases. Tags use
      underscores for multi-word (looking_at_viewer). Phrases are
      natural English. Do NOT emit Pony score_* tags.
    example_prompt: >-
      1girl, long_hair, looking_at_viewer, soft_lighting, detailed_skin,
      sharp_focus, photorealistic, cinematic_light,
      shallow_depth_of_field, masterpiece, best quality, amazing quality,
      very aesthetic, newest
    examples:
      - tier: T2_implied
        scene:
          pose: standing relaxed
          camera: medium shot
          lighting: soft window light
          environment_detail: minimalist studio
          mood_note: calm
        expected_facet:
          booru_tags: "1girl, long_hair, looking_at_viewer, lingerie, lace_trim, standing, indoors, soft_lighting, detailed_skin, sharp_focus, photorealistic, cinematic_light, shallow_depth_of_field"
          scene_prose: "A confident woman in delicate lace lingerie stands in a minimalist studio, soft natural light from the window catching her features."
          realism_camera: CAMERA_SONY_A7RV
          realism_lens: LENS_85MM_F14
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_EDITORIAL_FASHION
          lighting_directive: LIGHT_WINDOW_SIDE
          mood_aesthetic: MOOD_SERENE
          narrative_moment: NARR_COFFEE_MORNING_PAPER
      - tier: T3_artnude
        scene:
          pose: reclined on side
          camera: close-up
          lighting: golden hour
          environment_detail: linen sheets
          mood_note: intimate
        expected_facet:
          booru_tags: "1girl, long_hair, looking_at_viewer, lying, sheet, partially_covered, golden_hour, soft_skin, breasts, detailed_skin, photorealistic, intimate"
          scene_prose: "A woman reclines on her side under a draped linen sheet, golden hour light spilling across the bed and her skin in soft warm tones."
          realism_camera: CAMERA_LEICA_M11
          realism_lens: LENS_85MM_F14
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_FINE_NUDE
          lighting_directive: LIGHT_GOLDEN_HOUR
          mood_aesthetic: MOOD_INTIMATE
          narrative_moment: NARR_JUST_WOKEN_TANGLED_SHEETS
          environment_setting: ENV_MORNING_BEDROOM
          environment_atmosphere: ATM_DUST_MOTES_IN_LIGHT
          nsfw_anatomy: NSFW_BREAST_NATURAL
          nsfw_posture: NSFW_RECLINED_NUDE
      - tier: T4_explicit
        scene:
          pose: lying back
          camera: medium close-up
          lighting: warm overhead
          environment_detail: rumpled sheets
          mood_note: sultry
        expected_facet:
          booru_tags: "1girl, mature_female, long_hair, looking_at_viewer, lying, on_back, knee_up, completely_nude, breasts, medium_breasts, nipples, navel, pussy, spread_legs, anatomically_correct, detailed_skin, intimate, fine_art_nude, photorealistic"
          scene_prose: "A fully nude adult woman lies on rumpled white sheets, one knee raised, bare breasts and natural nipples visible, looking directly at the camera with a sultry expression under a warm overhead practical light."
          realism_camera: CAMERA_SONY_A7RV
          realism_lens: LENS_50MM_F18
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_FINE_NUDE
          lighting_directive: LIGHT_SOFT_FILL
          mood_aesthetic: MOOD_SENSUAL
          narrative_moment: NARR_JUST_WOKEN_TANGLED_SHEETS
          environment_setting: ENV_MORNING_BEDROOM
          environment_atmosphere: ATM_DUST_MOTES_IN_LIGHT
          nsfw_anatomy: NSFW_FULL_NUDE
          nsfw_posture: NSFW_RECLINED_NUDE
          nsfw_act: NSFW_T4_SOLO_GAZE

  # ── Flux.1 Dev / Schnell (vanilla) ────────────────────────────────────
  # CFG-distilled: negatives are ignored (FluxGuidance takes over).
  # T5-XXL encoder window is 512 on Dev. No weighting syntax.
  flux:
    prompt_style: flux_natural
    default_render_model: null
    default_template: null
    quality_prefix: []
    quality_suffix: []
    # CFG-distilled — negatives are no-ops; axes stay empty. Note
    # subject_count axis is also empty for the same reason — Flux can't
    # enforce single-subject via negatives. The pipeline's positive-side
    # solo_anchor + LLM directives carry the constraint instead.
    negative_axes:
      anatomy: []
      medium: []
      skin: []
      quality: []
      watermark: []
      safety: []
      censor: []
      subject_count: []
    supports_negative_prompt: false
    supports_weighting: false
    clip_skip: 1
    max_tokens: 512
    tokenizer_id: t5
    structure_rules: >-
      Natural-language prose only. One to three complete sentences.
      Subject first, then action, environment, lighting, camera. No
      tags, no score_*, no weighting syntax, no negative prompt.
    avoid_words: [score_9, score_8_up, score_7_up, masterpiece, "best quality"]
    # Prose family — higher temp gives richer, more varied sentences
    # while staying grammatical.
    llm_temperature: 0.8
    llm_hint: >-
      Emit scene fields as natural-English phrases that flow into a
      paragraph (e.g. "soft natural window light", not "soft_lighting").
    example_prompt: >-
      A confident woman standing in a modern loft apartment with soft
      window light illuminating her features. She has realistic skin
      texture and a sharp jawline. The room has warm tones with a
      cinematic depth of field, creating an intimate and elegant
      atmosphere.
    examples:
      - tier: T2_implied
        scene:
          pose: standing relaxed
          camera: medium shot
          lighting: soft window light
          environment_detail: modern loft
          mood_note: calm and elegant
        expected_facet:
          scene_prose: "A confident woman in cream silk lingerie stands in a modern loft apartment, soft window light from the left catching her features. The room has warm tones, creating an intimate and elegant atmosphere with a cinematic shallow depth of field."
          realism_camera: CAMERA_SONY_A7RV
          realism_lens: LENS_85MM_F14
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_EDITORIAL_FASHION
          lighting_directive: LIGHT_WINDOW_SIDE
          mood_aesthetic: MOOD_SERENE
          narrative_moment: NARR_COFFEE_MORNING_PAPER
      - tier: T3_artnude
        scene:
          pose: reclined on side
          camera: close-up
          lighting: golden hour
          environment_detail: linen sheets on a low platform bed
          mood_note: intimate and unhurried
        expected_facet:
          scene_prose: "A woman reclines on her side on linen sheets, half-draped under a sheer cotton wrap, golden hour light pouring through the window and warming her skin. The mood is intimate and unhurried with a soft cinematic depth of field."
          realism_camera: CAMERA_LEICA_M11
          realism_lens: LENS_85MM_F14
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_FINE_NUDE
          lighting_directive: LIGHT_GOLDEN_HOUR
          mood_aesthetic: MOOD_INTIMATE
          narrative_moment: NARR_JUST_WOKEN_TANGLED_SHEETS
          environment_setting: ENV_MORNING_BEDROOM
          environment_atmosphere: ATM_DUST_MOTES_IN_LIGHT
          nsfw_anatomy: NSFW_BREAST_NATURAL
          nsfw_posture: NSFW_RECLINED_NUDE
      - tier: T4_explicit
        scene:
          pose: lying back, knee raised
          camera: medium close-up
          lighting: warm overhead practical
          environment_detail: rumpled white sheets
          mood_note: sultry and direct
        expected_facet:
          scene_prose: "A fully nude adult woman lies on rumpled white cotton sheets, one knee raised, the other extended, bare breasts and natural nipples visible, soft pubic shadow at the hip. She holds the camera's gaze with a direct, sultry expression. Warm overhead practical light pools across her bare skin and the bedding, sculpting collarbone, ribs, and thigh into a clean fine-art nude composition."
          realism_camera: CAMERA_SONY_A7RV
          realism_lens: LENS_50MM_F18
          realism_film_stock: FILM_PORTRA_400
          art_style_reference: ART_FINE_NUDE
          lighting_directive: LIGHT_SOFT_FILL
          mood_aesthetic: MOOD_SENSUAL
          narrative_moment: NARR_JUST_WOKEN_TANGLED_SHEETS
          environment_setting: ENV_MORNING_BEDROOM
          environment_atmosphere: ATM_DUST_MOTES_IN_LIGHT
          nsfw_anatomy: NSFW_FULL_NUDE
