id: flux2_klein_9b
display_name: FLUX.2 Klein 9B (distilled)
filename: flux-2-klein-9b.safetensors
architecture: flux2
family: flux2
# Klein 9B is step-distilled + guidance-distilled from FLUX.2-[dev] 32B.
# These four numbers are CONTRACT, not preference — _build_flux2() will
# clamp back to them if a caller overrides. cfg > 1.0 burns out
# highlights; steps > ~6 produce marginal detail but blown tonal range.
default_sampler: euler
default_scheduler: simple
default_steps: 4
default_cfg: 1.0
default_clip_skip: null
supports_ipadapter: false
supports_lora: true
# Canonical BFL 32-channel VAE. DO NOT use
# `full_encoder_small_decoder.safetensors` — that's a reduced-decoder
# variant from a different release line.
vae_filename: flux2-vae.safetensors
# Single Qwen3-8B encoder replaces CLIP + T5. Use the fp8-mixed build
# the user has; 48 GB MPS handles it comfortably alongside the 18 GB UNET.
text_encoder: qwen_3_8b_fp8mixed.safetensors
# Aligned with BFL Klein 9B guide — 1 megapixel budget per render.
resolution_portrait: [832, 1216]
resolution_square: [1024, 1024]
resolution_landscape: [1216, 832]
# License metadata — FLUX NCL applies to the 9B tier. Commercial
# distribution requires either a BFL commercial license or switching
# to the 4B Apache-2.0 Klein tier. The license gate in
# src/memory/model_registry.py refuses to register this model when
# pipeline.yaml::compliance.commercial_mode is true.
license: flux_ncl
commercial_use: false
active: true
notes: >-
  FLUX.2 Klein 9B — 9B flow-matching transformer, step-distilled to
  4 inference steps. Single-encoder (Qwen3-8B, 12288-dim), 32-channel
  VAE. Workflow: UNETLoader + CLIPLoader(type=flux2) + VAELoader +
  KSampler(cfg=1.0, steps=4, euler, simple). No FluxGuidance, no
  ModelSamplingFlux, no DualCLIPLoader. Negative prompts are no-ops at
  cfg=1.0. Prompting is prose-only per BFL Klein 9B guide: subject →
  setting → details → lighting → atmosphere, 30–80 words. FLUX.1 LoRAs
  are architecturally INCOMPATIBLE (different attention dims). Do NOT
  stack turbo LoRAs on Klein — Klein is already distilled. License:
  FLUX NCL (non-commercial only for the 9B tier).

# Active FLUX.2-Klein-9B LoRA stack. Max 2 active at once per
# CLAUDE.md invariant — enforced at load time by ModelRegistryEntry.
# Entries with `enabled: true` are merged into the style_profile
# lora_stack by StyleProfileForWorkflow (when the profile provides
# none), which WorkflowBuilder._build_flux2 then wires into
# lora_loader_0 / lora_loader_1 of config/comfyui_workflows/flux2/base.json.
# Files must sit under ~/AI/apps/ComfyUI/models/loras/.
#
# Portrait Engine (V2_flux_klein_4.safetensors) is deliberately NOT
# listed: its author recommends 15+ steps (5+ minimum); Klein 9B is
# step-distilled to 4 steps (_build_flux2 clamps to <=6), so the LoRA
# would train-mismatch and produce muddy output. Revisit when/if a
# non-distilled FLUX.2 base family is added.
#
# Do NOT stack either turbo LoRA (Flux_2-Turbo-LoRA_comfyui.safetensors
# / Flux2TurboComfyv2.safetensors) on Klein — Klein is already
# distilled; turbo-on-distilled compounds step collapse.
lora_stack:
  - name: ultra_real_v4
    filename: ultra_real_v4.safetensors
    strength: 0.70
    purpose: baseline realism + skin texture + NSFW detailing (Klein 9B-trained)
    enabled: true
  - name: klein_slider_anatomy
    filename: klein_slider_anatomy.safetensors
    strength: 2.0
    purpose: anatomy/quality slider — corrects 4-step Klein misfires
    enabled: true

prompt:
  extend:
    # Ultra Real V4's author reports ~10% realism lift when this phrase
    # seeds the prompt. Surfaced via ctx.augment_system_prompt so the
    # LLM can place it naturally inside the BFL 5-anchor order —
    # prepending it directly would fight subject-first word-order bias.
    trigger_words:
      - "This is a high-quality photograph of"
    negative_prompt: ""  # ignored at cfg=1.0 but kept for schema parity
    avoid_words: []
  override: {}
