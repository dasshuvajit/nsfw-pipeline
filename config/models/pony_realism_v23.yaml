id: pony_realism_v23
display_name: Pony Realism v2.3
filename: ponyRealism_V23.safetensors
architecture: pony
family: pony
default_sampler: dpmpp_2m_sde
default_scheduler: karras
default_steps: 30
default_cfg: 6.5
default_clip_skip: 2
supports_ipadapter: true
supports_lora: true
vae_filename: null
text_encoder: null
resolution_portrait: [896, 1152]
resolution_square: [1024, 1024]
resolution_landscape: [1152, 896]
active: true
notes: >-
  Pony Realism — Danbooru tags, no model-specific embeddings. AVOID
  dpmpp_2m (DPM++ 2M Karras). Prefer female/male over woman/man for
  better tagging. Phase 3 structure_intro pins the realism vocabulary
  in the LLM-stable leading window (after the score chain + BREAK).

prompt:
  extend:
    trigger_words: []
    avoid_words: [anime, cartoon, 3d render]
  override:
    # Phase 3c — pin the photoreal vocabulary so source_photograph,
    # photo (medium), and realistic land in the leading-window slot
    # right after the 6-tier score chain (the most-weighted CLIP
    # tokens after the prefix). Preserves the per-call source_tag
    # the LLM may emit on the facet — the composer's
    # _ensure_pony_source_tag honours it before the structure_intro.
    structure_intro: ["source_photograph", "photo (medium)", "realistic"]
