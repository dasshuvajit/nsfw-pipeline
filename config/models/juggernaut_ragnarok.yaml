id: juggernaut_ragnarok
display_name: Juggernaut XL Ragnarok
filename: juggernautXL_ragnarokBy.safetensors
architecture: sdxl
family: sdxl
resolution_portrait: [832, 1216]
resolution_square: [1024, 1024]
resolution_landscape: [1216, 832]
license: creativeml_openrail_pp_m
commercial_use: true
active: true
notes: >-
  Civitai model 133005 (RunDiffusion). VAE is baked in. Author-recommended
  template contract: DPM++ 2M SDE, 30-40 steps, CFG 3-6 (lower → more
  photoreal). No baked-in LoRAs. License explicitly allows reselling
  outputs.

prompt:
  extend:
    trigger_words:
      - photograph
      - skin textures
      - highlighted skin
      - film grain
    negative_prompt: ""
    avoid_words:
      - anime
      - cartoon
      - 3d render
  override: {}
