id: lustify_olt
display_name: Lustify OLT
filename: lustifySDXLNSFW_oltFIXEDTEXTURES.safetensors
architecture: sdxl
family: sdxl
default_sampler: dpmpp_2m_sde
default_scheduler: exponential
default_steps: 30
default_cfg: 3.5
default_clip_skip: null
supports_ipadapter: true
supports_lora: true
vae_filename: null
text_encoder: null
resolution_portrait: [768, 1152]
resolution_square: [1024, 1024]
resolution_landscape: [1152, 768]
active: true
notes: Lustify OLT variant with fixed textures. Keep prompts concise.

prompt:
  extend:
    trigger_words:
      - shot on Canon EOS 5D
      - glamour photography
    negative_prompt: ""
    avoid_words: []
  override:
    max_tokens: 60