# Creative Direction — the tunable "house style" the art-director LLM honors.
# It biases the SUBJECT (look / focus / heat / quality) as a weighted lean while
# the niche/scene/setting variety keeps rotating — so every category stays in
# play and you get consistently striking subjects across different themes.
# This is DYNAMIC: edit this file to retune the whole library; no code change.
# It is injected into every art-director brief as priorities the LLM applies
# flexibly (not a fixed appended string), and the look pools are sampled per
# image so a series is never clones.
version: 1

# (2026-06-10 dedup: the former `subject_focus` and `realism` keys were
# REMOVED — they duplicated the SUBJECT FOCUS and LOOK sections of the
# art_director system prompt verbatim, and the LLM received both copies on
# every call. The system prompt is the single canonical home for invariant
# craft rules; this file keeps only the genuinely TUNABLE knobs below.)

# UNAMBIGUOUSLY ADULT. "young" here means young ADULT only — the age-safety
# layers (adult anchors + banned-token guards) are NEVER relaxed by this file.
# The age_look pool below varies her within this band per image (mid-20s →
# early 30s) so the catalog doesn't collapse to one same-age face.
age_band: >-
  a young adult woman in her twenties or early thirties, unmistakably an adult
  with fully mature adult features and figure

# How she reads — striking, sexy, desirable (glamour / sensual appeal).
appeal: >-
  strikingly beautiful and sexy, with a magnetic, alluring presence and an
  attractive, desirable adult figure

# Overt at T3/T4: sexy, sensual, explicit where the tier allows, attractive
# anatomy, confident — never coy or shy.
content_lean: >-
  lean overtly sexy and sensual; where the tier allows (T3/T4) the eroticism is
  explicit and confident and the body and anatomy are presented attractively,
  never coy or demure

# Tier-split sensual REGISTER dial. Consumed by art_director.generate_one,
# which appends the matching tier's line as the LAST (most-weighted) line of the
# tier directive. Public tiers (T1/T2) stay tasteful / aspirational / fine-art-
# lifestyle framed so DeviantArt's hyperrealism clause is respected; gated tiers
# (T3/T4) lean overtly aspirational-sexy for Fanvue/Premium. `content_lean` above
# stays the base HEAT lean; this refines it PER TIER and is the dial to retune
# how hot each tier reads. KEEP these free of audit-cliché adjectives
# ("luminous/sultry/breathtaking/strikingly beautiful") — they describe a lean,
# they are NOT copy for the LLM to echo. Absent → generate_one falls back to the
# base content_lean only (no per-tier register), so deleting this is safe.
sensual_register:
  T1_suggestive: >-
    tasteful and aspirational — confident come-hither glamour through styling,
    pose and gaze, never crude; clearly fine-art / lifestyle-framed for a public
    gallery
  T2_implied: >-
    flirtatious and tease-forward — cleavage-forward styling with the explicit
    just hidden; desirable and a little dangerous, the withheld reveal doing the
    work, still public-safe
  T3_artnude: >-
    overtly sensual, aspirational-sexy — warm confident eroticism, the bare body
    desirable and inviting, glamour-nude heat, not cool gallery restraint
  T4_explicit: >-
    overtly sensual at full candor — confident heat throughout, the explicit one
    beautiful element of a flowing, gorgeously-lit figure, never crude or clinical

# WIDE look variety — sampled per image so the series isn't clones. Every entry
# is a young-adult, attractive look. 2026-06 audit overhaul: the old 8-hair/
# 6-figure pools were all long-hair colorways with one busty entry and NO
# face/skin axes — measured output: 0 freckles, 0 eye colors, 0 non-Caucasian
# skin markers in 114 prompts, "full bust" in 10%. Pools now span hair
# texture/length/style, figure (3 natural-busty entries per the stated
# representation goal), face features, complexion and age-look.
# Pool LENGTHS are deliberately coprime with the per-pool strides in
# art_director._creative_look (hair 28 / figure 20 / face 26 / complexion 18 /
# age_look 7) so rotations never lock to each other or to the 8 framing targets.
