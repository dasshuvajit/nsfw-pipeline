[pytest]
# Only collect the active suite under tests/ — keeps pytest from recursing into
# output/ (gitignored R&D scripts, some named *_test.py with module-level render
# code) or other dirs.
testpaths = tests
# tests/legacy holds the FROZEN structured-path suite (see legacy/README.md).
# Run it explicitly with:  pytest tests/legacy --override-ini addopts=
addopts = --ignore=tests/legacy
